<style>
@font-face { font-family: "Vazirmatn"; font-weight: 400; font-display: swap; src: url(fonts/vazirmatn-arabic-400-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }
@font-face { font-family: "Vazirmatn"; font-weight: 500; font-display: swap; src: url(fonts/vazirmatn-arabic-500-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }
@font-face { font-family: "Amiri Quran"; font-weight: 400; font-display: swap; src: url(fonts/amiri-quran-arabic-400-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC, U+102E0-102FB, U+10E60-10E7E, U+10EC2-10EC4, U+10EFC-10EFF, U+1EE00-1EEFF; }
@font-face { font-family: "Amiri Quran"; font-weight: 400; font-display: swap; src: url(fonts/amiri-quran-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+FD3E-FD3F; }
@font-face { font-family: "Spectral"; font-weight: 400; font-style: normal; font-display: swap; src: url(fonts/spectral-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Spectral"; font-weight: 400; font-style: italic; font-display: swap; src: url(fonts/spectral-latin-400-italic.woff2) format("woff2"); }
@font-face { font-family: "Spectral"; font-weight: 600; font-style: normal; font-display: swap; src: url(fonts/spectral-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Outfit"; font-weight: 400; font-display: swap; src: url(fonts/outfit-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Outfit"; font-weight: 500; font-display: swap; src: url(fonts/outfit-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Outfit"; font-weight: 600; font-display: swap; src: url(fonts/outfit-latin-600-normal.woff2) format("woff2"); }

/* Layout: one calm reading column, like a single mushaf page; tabs on top, the verse is the hero. */
:root {
  --paper: #F2F5F1;
  --sheet: #FBFCFA;
  --ink: #15332C;
  --ink-soft: #4E6660;
  --line: #D6E0DA;
  --green: #1F6B57;
  --green-wash: #E0EDE7;
  --gold: #A9771F;
  --gold-wash: #F3E9D3;
  --warn: #9A4B2E;
  --f-ar: "Amiri Quran", "Amiri", "Scheherazade New", "Traditional Arabic", serif;
  --f-read: "Spectral", Georgia, "Times New Roman", serif;
  --f-fa: "Vazirmatn", Tahoma, "Segoe UI", "Geeza Pro", sans-serif;
  --f-ui: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0E1815; --sheet: #15221E; --ink: #E4ECE7; --ink-soft: #9DB2AA; --line: #2A3A35;
  --green: #5FBF9F; --green-wash: #1C3530; --gold: #D9AE5C; --gold-wash: #322A19; --warn: #E08D6B; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0E1815; --sheet: #15221E; --ink: #E4ECE7; --ink-soft: #9DB2AA; --line: #2A3A35;
  --green: #5FBF9F; --green-wash: #1C3530; --gold: #D9AE5C; --gold-wash: #322A19; --warn: #E08D6B; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 40px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px; }
.brand { font-family: var(--f-read); font-size: 1.35rem; font-weight: 600; letter-spacing: .01em; }
.brand small { display: block; font-family: var(--f-ui); font-size: .78rem; font-weight: 400; color: var(--ink-soft); letter-spacing: 0; }
.stats { display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
.stat { text-align: right; }
.stat b { display: block; font-size: 1.15rem; font-weight: 600; line-height: 1.1; }
.stat span { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }

nav.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
nav.tabs button { border: 0; background: transparent; padding: 9px 6px; border-radius: 9px; font-weight: 500; color: var(--ink-soft); display: flex; justify-content: center; align-items: center; gap: 6px; }
nav.tabs button[aria-selected="true"] { background: var(--green); color: var(--sheet); }
.count { font-size: .72rem; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--gold); color: var(--sheet); font-variant-numeric: tabular-nums; }

.page { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 22px 18px; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-soft); }
.surah-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.surah-line h2 { margin: 0; font-family: var(--f-read); font-size: 1.3rem; font-weight: 600; text-wrap: balance; }
.surah-line .ar-name { font-family: var(--f-ar); font-size: 1.5rem; color: var(--green); }
.meta { color: var(--ink-soft); font-size: .85rem; }

.bism { text-align: center; font-family: var(--f-ar); font-size: 1.35rem; color: var(--ink-soft); direction: rtl; }
.ayah { direction: rtl; text-align: center; font-family: var(--f-ar); font-size: clamp(1.9rem, 7.5vw, 2.6rem); line-height: 2.2; padding: 8px 4px; border-block: 1px solid var(--line); }
.w { display: inline-block; padding: 0 .08em; border-radius: 8px; transition: background .2s, color .2s; }
.w.hid { color: transparent; background: var(--green-wash); cursor: pointer; text-shadow: none; min-width: 1.4em; }
.w.hid:hover { background: var(--gold-wash); }
.w.peek { color: var(--gold); }
.mark { color: var(--gold); font-size: .8em; padding-inline: .15em; white-space: nowrap; }
.translit { font-family: var(--f-read); font-style: italic; font-size: 1.05rem; color: var(--ink-soft); text-align: center; }
.trans { font-family: var(--f-read); font-size: 1.08rem; text-align: center; max-width: 60ch; margin: 0 auto; }
.trans.nl { padding-top: 12px; border-top: 1px dashed var(--line); }
.trans + .trans { margin-top: -6px; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: .85rem; color: var(--ink-soft); }
.chip[aria-pressed="true"] { border-color: var(--green); color: var(--green); background: var(--green-wash); }
.hint { text-align: center; font-size: .82rem; color: var(--ink-soft); }

.reps { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--paper); border-radius: 12px; padding: 12px 14px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--green); }
.dot.on { background: var(--green); }
.reps-label { font-size: .85rem; color: var(--ink-soft); }
.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 10px; padding: 10px 16px; font-weight: 500; }
.btn.primary { background: var(--green); border-color: var(--green); color: var(--sheet); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--sheet); }
.btn.ghost { background: transparent; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 160px; }
a.listen { color: var(--green); font-weight: 500; text-decoration: none; font-size: .9rem; }
a.listen:hover { text-decoration: underline; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.done { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.done .big { font-family: var(--f-read); font-size: 1.4rem; font-weight: 600; text-wrap: balance; }
.done p { margin: 0; color: var(--ink-soft); max-width: 42ch; }

.rv-progress { height: 6px; background: var(--paper); border-radius: 3px; overflow: hidden; }
.rv-progress i { display: block; height: 100%; background: var(--gold); transition: width .3s; }

.path { display: flex; flex-direction: column; gap: 4px; }
.srow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); background: transparent; border-inline: 0; border-top: 0; text-align: left; width: 100%; }
.srow:last-child { border-bottom: 0; }
.srow .nm { font-weight: 500; }
.srow .nm em { font-style: normal; color: var(--ink-soft); font-weight: 400; font-size: .85rem; }
.srow .arn { font-family: var(--f-ar); font-size: 1.25rem; color: var(--green); line-height: 1.2; }
.cells { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 3px; }
.cell { width: 14px; height: 8px; border-radius: 2px; background: var(--line); }
.cell.l { background: var(--green); }
.cell.t { background: var(--gold); }
.srow .num { font-size: .8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.vlist { display: flex; flex-direction: column; }
.vitem { padding: 14px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.vitem .ar { direction: rtl; font-family: var(--f-ar); font-size: 1.55rem; line-height: 2; }
.vitem .en { font-family: var(--f-read); color: var(--ink-soft); }
.tag { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px; background: var(--green-wash); color: var(--green); align-self: flex-start; }
.tag.up { background: var(--paper); color: var(--ink-soft); }
.vnav { display: flex; flex-direction: column; gap: 10px; }
.vnav-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.vnav-row .btn { padding: 8px 12px; }
.vnav-row .btn:disabled { opacity: .35; cursor: default; }
.vcells { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.vcell { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--sheet); font-size: .82rem; font-variant-numeric: tabular-nums; color: var(--ink-soft); padding: 0; }
.vcell.l { background: var(--green-wash); border-color: var(--green-wash); color: var(--green); font-weight: 600; }
.vcell.cur { outline: 2px solid var(--gold); outline-offset: 1px; color: var(--ink); }
.vitem .open { color: var(--green); align-self: flex-start; font-weight: 500; font-size: .85rem; }
.back { border: 0; background: none; color: var(--green); padding: 0; font-weight: 500; align-self: flex-start; }

.settings { font-size: .88rem; color: var(--ink-soft); display: flex; flex-direction: column; gap: 10px; }
.settings .row-between label { color: var(--ink); }
.settings select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); }
.confirm { background: var(--gold-wash); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; color: var(--ink); }
.sync { font-size: .78rem; color: var(--ink-soft); text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 10px 16px; border-radius: 10px; font-size: .9rem; z-index: 20; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

header { flex-wrap: wrap; }
.picker { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--paper); border-radius: 12px; padding: 10px 12px; }
.picker label { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-soft); }
.picker select { flex: 1 1 200px; min-width: 0; font: inherit; font-weight: 500; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); }

.recbox { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.rec-btn { display: inline-flex; align-items: center; gap: 8px; }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); }
.recording .rec-dot { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.rec-list { display: flex; flex-direction: column; gap: 8px; }
.rec-item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.rec-item audio { grid-column: 1 / -1; width: 100%; height: 36px; }
.rec-item .meta { font-variant-numeric: tabular-nums; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--warn); font-size: .82rem; }
label.btn { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.time-on { font-variant-numeric: tabular-nums; }

.timecard { display: flex; flex-direction: column; gap: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.tstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-variant-numeric: tabular-nums; }
.tstats b { display: block; font-size: 1.15rem; font-weight: 600; }
.tstats span { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 92px; }
.bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; font-size: .7rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.bar i { display: block; width: 100%; max-width: 28px; border-radius: 4px 4px 2px 2px; background: var(--green); min-height: 2px; }
.bar.today i { background: var(--gold); }
.bar.empty i { background: var(--line); }
@media (prefers-reduced-motion: reduce) { .recording .rec-dot { animation: none; } }
/* ---- standalone app additions ---- */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); min-height: 100vh; }
[hidden] { display: none !important; }
.brand-col { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 0; }
.who-chip { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: .85rem; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; max-width: 100%; }
.who-chip .av, .pbtn .av { width: 26px; height: 26px; border-radius: 50%; background: var(--green); color: var(--sheet); display: inline-grid; place-items: center; font-size: .8rem; font-weight: 600; flex: none; }
.who-chip span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plist { display: flex; flex-direction: column; gap: 8px; }
.pbtn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--sheet); border-radius: 12px; padding: 12px; }
.pbtn .av { width: 40px; height: 40px; font-size: 1.05rem; }
.pbtn.cur { border-color: var(--green); background: var(--green-wash); }
.pbtn .pinfo { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.pbtn .pinfo b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pbtn .pinfo span { font-size: .82rem; color: var(--ink-soft); }
.field { display: flex; gap: 8px; flex-wrap: wrap; }
.field input, textarea { flex: 1 1 180px; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); }
textarea { width: 100%; min-height: 84px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; resize: vertical; word-break: break-all; }
.section { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.section h3 { margin: 0; font-family: var(--f-read); font-size: 1.1rem; font-weight: 600; color: var(--ink); }
.section p { margin: 0; }
.note { background: var(--gold-wash); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: .88rem; }
.mini { display: flex; gap: 14px; flex-wrap: wrap; }
.mini .linkbtn { color: var(--ink-soft); }

/* ---- fit every screen: phone single column; tablet wider with larger type; wide screens split reading | practice ---- */
html { font-size: 15px; }
body { font-size: 1rem; }
.split { display: flex; flex-direction: column; gap: 18px; }
.split > div { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
@media (min-width: 700px) {
  html { font-size: 16.5px; }
  .wrap { max-width: 820px; }
  .page { padding: 28px 30px; }
  .ayah { font-size: clamp(2.4rem, 5vw, 3.2rem); }
  .vcell { width: 40px; height: 40px; }
  .path { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; }
  .srow:last-child { border-bottom: 1px solid var(--line); }
}
@media (min-width: 1024px) {
  html { font-size: 17.5px; }
  .wrap { max-width: min(1280px, 100%); }
  .split { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 36px; align-items: start; }
  .split > .col-tools { position: sticky; top: 16px; background: var(--paper); border-radius: 14px; padding: 18px; }
  .ayah { font-size: clamp(2.6rem, 3.4vw, 3.6rem); }
  .path { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .vlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; }
}
@media (min-width: 1600px) { html { font-size: 19px; } }
.wrap[data-view="who"] { max-width: min(760px, 100%); }

/* ---- Persian text and surah stories ---- */
.trans.fa { font-family: var(--f-fa); line-height: 2; padding-top: 12px; border-top: 1px dashed var(--line); }
.trans.nl + .trans.fa, .trans + .trans.fa { margin-top: -6px; }
.vitem .fa { font-family: var(--f-fa); line-height: 1.9; text-align: right; }
.story { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--paper); }
.story summary { cursor: pointer; font-weight: 500; color: var(--green); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; list-style: none; }
.story summary::-webkit-details-marker { display: none; }
.story summary::after { content: "Show ▾"; font-size: .8rem; color: var(--ink-soft); font-weight: 400; }
.story[open] summary::after { content: "Hide ▴"; }
.story summary [lang="fa"] { font-family: var(--f-fa); }
.story-body { display: flex; flex-direction: column; gap: 12px; padding-top: 10px; }
.story-body p { margin: 0; line-height: 1.7; }
.story-body p[lang="fa"] { font-family: var(--f-fa); line-height: 2.1; text-align: right; padding-top: 10px; border-top: 1px dashed var(--line); }
.story-body .meta { font-size: .78rem; }
.kind-tag { font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; padding: 1px 7px; border-radius: 999px; background: var(--gold-wash); color: var(--gold); margin-left: 6px; vertical-align: 2px; font-style: normal; }

/* ---- quick actions and revelation details ---- */
.quick { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.quick .btn { flex: 1 1 160px; }
.quick .meta { flex-basis: 100%; text-align: center; }
.pill { display: inline-block; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; padding: 1px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; background: var(--green-wash); color: var(--green); }
.pill.Medinan { background: var(--gold-wash); color: var(--gold); }
.pill.Hadith { background: var(--paper); color: var(--ink-soft); border: 1px solid var(--line); }
.rev { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
.rev [lang="fa"] { font-family: var(--f-fa); text-align: right; line-height: 1.9; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand-col">
      <div class="brand">Ayah a Day<small>Short surahs, one verse at a time</small></div>
      <button class="who-chip" id="whoBtn" hidden aria-label="Switch learner"><span class="av" id="whoAv">?</span><span class="nm" id="whoName"></span> ▾</button>
