const DATA = {"S":[{"n":1,"ar":"الفاتحة","tr":"Al-Fatihah","m":"The Opener","c":7,"kind":"surah","type":"meccan"},{"n":1002,"kind":"dua","ar":"الثناء","tr":"Thana","m":"Opening praise","where":"Prayer · after the opening takbir","c":1},{"n":1003,"kind":"dua","ar":"التشهد","tr":"At-Tahiyyat","m":"The Tashahhud","where":"Prayer · every sitting","c":2},{"n":1004,"kind":"dua","ar":"الصلاة الإبراهيمية","tr":"Salawat Ibrahimiyya","m":"Blessings on the Prophet ﷺ","where":"Prayer · final sitting","c":2},{"n":1005,"kind":"quran","ar":"ربنا آتنا","tr":"Rabbana Atina","m":"Our Lord, give us good","ref":"2/201","where":"Prayer · final sitting (Al-Baqarah 2:201)","c":1},{"n":1001,"kind":"quran","ar":"آية الكرسي","tr":"Ayat al-Kursi","m":"The Verse of the Throne","ref":"2/255","where":"Al-Baqarah 2:255","c":1},{"n":114,"ar":"الناس","tr":"An-Nas","m":"Mankind","c":6,"kind":"surah","type":"meccan"},{"n":113,"ar":"الفلق","tr":"Al-Falaq","m":"The Daybreak","c":5,"kind":"surah","type":"meccan"},{"n":112,"ar":"الإخلاص","tr":"Al-Ikhlas","m":"The Sincerity","c":4,"kind":"surah","type":"meccan"},{"n":111,"ar":"المسد","tr":"Al-Masad","m":"The Palm Fiber","c":5,"kind":"surah","type":"meccan"},{"n":110,"ar":"النصر","tr":"An-Nasr","m":"The Divine Support","c":3,"kind":"surah","type":"medinan"},{"n":109,"ar":"الكافرون","tr":"Al-Kafirun","m":"The Disbelievers","c":6,"kind":"surah","type":"meccan"},{"n":108,"ar":"الكوثر","tr":"Al-Kawthar","m":"The Abundance","c":3,"kind":"surah","type":"meccan"},{"n":107,"ar":"الماعون","tr":"Al-Ma'un","m":"The Small kindnesses","c":7,"kind":"surah","type":"meccan"},{"n":106,"ar":"قريش","tr":"Quraysh","m":"Quraysh","c":4,"kind":"surah","type":"meccan"},{"n":105,"ar":"الفيل","tr":"Al-Fil","m":"The Elephant","c":5,"kind":"surah","type":"meccan"},{"n":104,"ar":"الهمزة","tr":"Al-Humazah","m":"The Traducer","c":9,"kind":"surah","type":"meccan"},{"n":103,"ar":"العصر","tr":"Al-'Asr","m":"The Declining Day","c":3,"kind":"surah","type":"meccan"},{"n":102,"ar":"التكاثر","tr":"At-Takathur","m":"The Rivalry in world increase","c":8,"kind":"surah","type":"meccan"},{"n":101,"ar":"القارعة","tr":"Al-Qari'ah","m":"The Calamity","c":11,"kind":"surah","type":"meccan"},{"n":100,"ar":"العاديات","tr":"Al-'Adiyat","m":"The Courser","c":11,"kind":"surah","type":"meccan"},{"n":99,"ar":"الزلزلة","tr":"Az-Zalzalah","m":"The Earthquake","c":8,"kind":"surah","type":"medinan"},{"n":98,"ar":"البينة","tr":"Al-Bayyinah","m":"The Clear Proof","c":8,"kind":"surah","type":"medinan"},{"n":97,"ar":"القدر","tr":"Al-Qadr","m":"The Power","c":5,"kind":"surah","type":"meccan"},{"n":96,"ar":"العلق","tr":"Al-'Alaq","m":"The Clot","c":19,"kind":"surah","type":"meccan"},{"n":95,"ar":"التين","tr":"At-Tin","m":"The Fig","c":8,"kind":"surah","type":"meccan"},{"n":94,"ar":"الشرح","tr":"Ash-Sharh","m":"The Relief","c":8,"kind":"surah","type":"meccan"},{"n":93,"ar":"الضحى","tr":"Ad-Duhaa","m":"The Morning Hours","c":11,"kind":"surah","type":"meccan"}],"V":[[1,1,"بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ","Bismi Allahi alrrahmani alrraheemi","In the name of Allah, the Entirely Merciful, the Especially Merciful","In de naam van Allah, de Erbarmer, de Meest Barmhartige","به نام الله بخشندۀ مهربان",1],[1,2,"ٱلۡحَمۡدُ لِلَّهِ رَبِّ ٱلۡعَٰلَمِينَ","Alhamdu lillahi rabbi alAAalameena","[All] praise is [due] to Allah, Lord of the worlds","Alle lof zij Allah, de Heer der Werelden","تمام ستایش‌ها [و سپاس‌ها] از آنِ الله ـ پروردگار جهانیان‌ ـ است؛",2],[1,3,"ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ","Alrrahmani alrraheemi","The Entirely Merciful, the Especially Merciful","De Erbarmer, de Meest Barmhartige","بخشندۀ مهربان است؛",3],[1,4,"مَٰلِكِ يَوۡمِ ٱلدِّينِ","Maliki yawmi alddeeni","Sovereign of the Day of Recompense","De Heerser op de Dag des Oordeels","مالک روزِ جزاست",4],[1,5,"إِيَّاكَ نَعۡبُدُ وَإِيَّاكَ نَسۡتَعِينُ","Iyyaka naAAbudu waiyyaka nastaAAeenu","It is You we worship and You we ask for help","U alleen aanbidden wij en U alleen vragen wij om hulp","[پروردگارا] تنها تو را عبادت می‌کنیم و تنها از تو یاری [و مدد] می‌جوییم",5],[1,6,"ٱهۡدِنَا ٱلصِّرَٰطَ ٱلۡمُسۡتَقِيمَ","Ihdina alssirata almustaqeema","Guide us to the straight path","Leid ons op het rechte Pad","ما را به راه راست هدایت فرما [و همواره در این راه، ثابت‌قدم بدار]؛",6],[1,7,"صِرَٰطَ ٱلَّذِينَ أَنۡعَمۡتَ عَلَيۡهِمۡ غَيۡرِ ٱلۡمَغۡضُوبِ عَلَيۡهِمۡ وَلَا ٱلضَّآلِّينَ","Sirata allatheena anAAamta AAalayhim ghayri almaghdoobi AAalayhim wala alddalleena","The path of those upon whom You have bestowed favor, not of those who have evoked [Your] anger or of those who are astray","Het Pad van degenen aan wie U gunsten hebt geschonken, niet van degenen op wie de toorn rust en niet dat van de dwalenden","راه کسانی [همچون پیامبران، شهیدان، راستگویان و نیکوکاران] ‌که به آنان نعمت داده‌ای، نه [راه] کسانی که بر آنان خشم گرفته شده است [= یهود] و نه [راه] گمراهان [= نصاری]",7],[114,1,"قُلۡ أَعُوذُ بِرَبِّ ٱلنَّاسِ","Qul aAAoothu birabbi alnnasi","Say, \"I seek refuge in the Lord of mankind","Zeg: \"Ik zoek bescherming bij de Heer van de mensen","[ای پیامبر،] بگو: «به پروردگار مردم پناه می‌برم،",1],[114,2,"مَلِكِ ٱلنَّاسِ","Maliki alnnasi","The Sovereign of mankind","De Koning van de mensen","فرمانروای مردم،",2],[114,3,"إِلَٰهِ ٱلنَّاسِ","Ilahi alnnasi","The God of mankind","De God van de mensen","معبود مردم،",3],[114,4,"مِن شَرِّ ٱلۡوَسۡوَاسِ ٱلۡخَنَّاسِ","Min sharri alwaswasi alkhannasi","From the evil of the retreating whisperer","Tegen het kwaad van de wegsluipende influisteraar","از شرِ [شیطانِ] وسوسه‌گر که [به هنگام ذکر الله،] پنهان می‌گردد؛",4],[114,5,"ٱلَّذِي يُوَسۡوِسُ فِي صُدُورِ ٱلنَّاسِ","Allathee yuwaswisu fee sudoori alnnasi","Who whispers [evil] into the breasts of mankind","Degene die in de harten van de mensen influistert","همان [وسوسه‌گری] که در دل‌های مردم وسوسه می‌کند؛",5],[114,6,"مِنَ ٱلۡجِنَّةِ وَٱلنَّاسِ","Mina aljinnati wa alnnasm","From among the jinn and mankind","Van de Djinn's en de mensen","از جنیان [باشد] و [یا از] آدمیان»",6],[113,1,"قُلۡ أَعُوذُ بِرَبِّ ٱلۡفَلَقِ","Qul aAAoothu birabbi alfalaqi","Say, \"I seek refuge in the Lord of daybreak","Zeg: \"Ik zoek bescherming bij de Heer der dageraad","[ای پیامبر،] بگو: «به پروردگار سپیده‌دم پناه می‌برم،",1],[113,2,"مِن شَرِّ مَا خَلَقَ","Min sharri ma khalaqa","From the evil of that which He created","Tegen het kwaad dat Hij geschapen heeft","از شرِ تمام آنچه آفریده است،",2],[113,3,"وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ","Wamin sharri ghasiqin itha waqaba","And from the evil of darkness when it settles","En tegen het kwaad van de donkere nacht wanneer hij aanbreekt","و از شر تاریکی شب، آنگاه که همه جا را فراگیرد،",3],[113,4,"وَمِن شَرِّ ٱلنَّفَّـٰثَٰتِ فِي ٱلۡعُقَدِ","Wamin sharri alnnaffathati fee alAAuqadi","And from the evil of the blowers in knots","En tegen het kwaad van hen die op knopen blazen","و از شر [زنان جادوگر] که با افسون در گره‌ها می‌دمند",4],[113,5,"وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ","Wamin sharri hasidin itha hasada","And from the evil of an envier when he envies","En tegen het kwaad van een jaloerse wanneer deze jaloers is","و از شر [هر] حسود، آنگاه که حسد ورزد»",5],[112,1,"قُلۡ هُوَ ٱللَّهُ أَحَدٌ","Qul huwa Allahu ahadun","Say, \"He is Allah, [who is] One","Zeg: \"Hij is Allah, de Enige","[ای پیامبر] بگو: «او الله یکتا و یگانه است",1],[112,2,"ٱللَّهُ ٱلصَّمَدُ","Allahu alssamadu","Allah, the Eternal Refuge","Allah is de Enige van Wie al het geschapene afhankelijk is","الله بی‌نیاز است [و همه نیازمند او هستند]",2],[112,3,"لَمۡ يَلِدۡ وَلَمۡ يُولَدۡ","Lam yalid walam yooladu","He neither begets nor is born","Hij heeft niet verwekt en is niet verwekt","نه [فرزندی] زاده و نه [از کسی] زاده شده است",3],[112,4,"وَلَمۡ يَكُن لَّهُۥ كُفُوًا أَحَدُۢ","Walam yakun lahu kufuwan ahadun","Nor is there to Him any equivalent","En niet één is aan Hem gelijkwaardig","و هیچ کس همانند و همتای او نبوده و نیست»",4],[111,1,"تَبَّتۡ يَدَآ أَبِي لَهَبٖ وَتَبَّ","Tabbat yada abee lahabin watabba","May the hands of Abu Lahab be ruined, and ruined is he","Vernietigd zijn de handen van Aboe Lahab en vernietigd is hij","بریده باد هر دو دست اَبولَهَب و هلاک باد خودش",1],[111,2,"مَآ أَغۡنَىٰ عَنۡهُ مَالُهُۥ وَمَا كَسَبَ","Ma aghna AAanhu maluhu wama kasaba","His wealth will not avail him or that which he gained","Zijn bezit en wat hij voortbracht, baat hem niet","مال و ثروتش و آنچه به دست آورده بود، او را بی‌نیاز نساخت [و برایش سودی نبخشید]",2],[111,3,"سَيَصۡلَىٰ نَارٗا ذَاتَ لَهَبٖ","Sayasla naran thata lahabin","He will [enter to] burn in a Fire of [blazing] flame","Hij zal een vuur van vlammen (de Hel) binnengaan","به زودی به آتش شعله‌ور درخواهد آمد؛",3],[111,4,"وَٱمۡرَأَتُهُۥ حَمَّالَةَ ٱلۡحَطَبِ","Waimraatuhu hammalata alhatabi","And his wife [as well] - the carrier of firewood","En ook zijn vrouw, aandraagster van brandhout","و همسرش [اُمّ‌جمیل، آن] هیزم‌کش [آتش‌افروز نیز وارد آتش دوزخ می‌شود]",4],[111,5,"فِي جِيدِهَا حَبۡلٞ مِّن مَّسَدِۭ","Fee jeediha hablun min masadin","Around her neck is a rope of [twisted] fiber","Om haar nek een touw van vezels","[در حالی که] طنابی از لیفِ خرما بر گردنش است",5],[110,1,"إِذَا جَآءَ نَصۡرُ ٱللَّهِ وَٱلۡفَتۡحُ","Itha jaa nasru Allahi waalfathu","When the victory of Allah has come and the conquest","Als de hulp van Allah en de overwinning zijn gekomen","[ای پیامبر،] هنگامی ‌که یاری الله و پیروزی فرا رسد [و فتح مکه رخ دهد]،",1],[110,2,"وَرَأَيۡتَ ٱلنَّاسَ يَدۡخُلُونَ فِي دِينِ ٱللَّهِ أَفۡوَاجٗا","Waraayta alnnasa yadkhuloona fee deeni Allahi afwajan","And you see the people entering into the religion of Allah in multitudes","En jij (O Mohammed) de mensen in grote groepen tot de godsdienst van Allah ziet toetreden","و مردم را ببینی که گروه‌گروه در دین الله داخل می‌شوند",2],[110,3,"فَسَبِّحۡ بِحَمۡدِ رَبِّكَ وَٱسۡتَغۡفِرۡهُۚ إِنَّهُۥ كَانَ تَوَّابَۢا","Fasabbih bihamdi rabbika waistaghfirhu innahu kana tawwaban","Then exalt [Him] with praise of your Lord and ask forgiveness of Him. Indeed, He is ever Accepting of repentance","Prijs dan de Glorie van jouw Heer en vraag Hem om vergeving. Voorwaar, Hij is Berouwaanvaardend","پس به ستایش پروردگارت تسبیح گوی و از او آمرزش بخواه؛ همانا او بسیار توبه‌پذیر است",3],[109,1,"قُلۡ يَـٰٓأَيُّهَا ٱلۡكَٰفِرُونَ","Qul ya ayyuha alkafiroona","Say, \"O disbelievers","Zeg (O Mohammed): \"O ongelovigen","[ای پیامبر،] بگو: «ای کافران،",1],[109,2,"لَآ أَعۡبُدُ مَا تَعۡبُدُونَ","La aAAbudu ma taAAbudoona","I do not worship what you worship","Ik aanbid niet wat jullie aanbidden","آنچه را که شما عبادت می‌کنید، من عبادت نمی‌کنم،",2],[109,3,"وَلَآ أَنتُمۡ عَٰبِدُونَ مَآ أَعۡبُدُ","Wala antum AAabidoona ma aAAbudu","Nor are you worshippers of what I worship","En jullie zijn geen aanbidders van wat ik aanbid","و [نیز] آنچه را که من عبادت می‌کنم شما عبادت نمی‌کنید",3],[109,4,"وَلَآ أَنَا۠ عَابِدٞ مَّا عَبَدتُّمۡ","Wala ana AAabidun ma AAabadtum","Nor will I be a worshipper of what you worship","En ik zal nooit een aanbidder worden van wat jullie aanbidden","و نه من عبادت‌کننده آنچه شما عبادت کرده‌اید خواهم بود؛",4],[109,5,"وَلَآ أَنتُمۡ عَٰبِدُونَ مَآ أَعۡبُدُ","Wala antum AAabidoona ma aAAbudu","Nor will you be worshippers of what I worship","En jullie zullen nooit aanbidders worden van wat ik aanbid","و نه شما عبادت‌کننده آنچه من عبادت می‌کنم خواهید بود",5],[109,6,"لَكُمۡ دِينُكُمۡ وَلِيَ دِينِ","Lakum deenukum waliya deeni","For you is your religion, and for me is my religion","Daarom, voor jullie jullie godsdienst en voor mij mijn godsdienst","[بنابراین] آیین شما [که آن را برای خویش ساخته‌اید] برای خود‌تان باد و آیین من [که الله آن را بر من فرستاده است] برای خودم»",6],[108,1,"إِنَّآ أَعۡطَيۡنَٰكَ ٱلۡكَوۡثَرَ","Inna aAAtaynaka alkawthara","Indeed, We have granted you, [O Muhammad], al-Kawthar","Waarlijk, Wij hebben jou de overvloed geschonken","[ای پیامبر،] به راستی که ما خیرِ بی‌نهایت [از جمله رود کوثر در بهشت را] به تو عطا کردیم؛",1],[108,2,"فَصَلِّ لِرَبِّكَ وَٱنۡحَرۡ","Fasalli lirabbika wainhar","So pray to your Lord and sacrifice [to Him alone]","Verricht daarom de shalât voor jouw Heer en slacht offerdieren","پس برای پروردگارت نماز بخوان و قربانی کن",2],[108,3,"إِنَّ شَانِئَكَ هُوَ ٱلۡأَبۡتَرُ","Inna shaniaka huwa alabtaru","Indeed, your enemy is the one cut off","Voorwaar, jouw hater, hij is het die afgesneden is","بی‌تردید، دشمنت [از همۀ خیرات و برکات و نام و نشان، بی‌بهره و] بُریده است",3],[107,1,"أَرَءَيۡتَ ٱلَّذِي يُكَذِّبُ بِٱلدِّينِ","Araayta allathee yukaththibu bialddeeni","Have you seen the one who denies the Recompense","Weet jij wie degene is die (de Dag van) het Oordeel loochent","[ای پیامبر،] آیا کسی را که [روز] جزا را تکذیب می‌کنند، دیده‌ای؟",1],[107,2,"فَذَٰلِكَ ٱلَّذِي يَدُعُّ ٱلۡيَتِيمَ","Fathalika allathee yaduAAAAu alyateema","For that is the one who drives away the orphan","Dat is degene die de wees wegduwt","او [همان] کسی است ‌که یتیم را [با خشونت از خود] می‌رانَد",2],[107,3,"وَلَا يَحُضُّ عَلَىٰ طَعَامِ ٱلۡمِسۡكِينِ","Wala yahuddu AAala taAAami almiskeeni","And does not encourage the feeding of the poor","En hij spoort niet aan tot het geven van voedsel aan de behoeftigen","و [دیگران را] به اطعامِ مسکین تشویق نمی‌کند",3],[107,4,"فَوَيۡلٞ لِّلۡمُصَلِّينَ","Fawaylun lilmusalleena","So woe to those who pray","Wee dan de verrichters van de shalât","پس وای بر نمازگزاران",4],[107,5,"ٱلَّذِينَ هُمۡ عَن صَلَاتِهِمۡ سَاهُونَ","Allatheena hum AAan salatihim sahoona","[But] who are heedless of their prayer","Degenen die onachtzaam zijn met hun shalât","همان کسانی ‌که از نمازشان غافلند",5],[107,6,"ٱلَّذِينَ هُمۡ يُرَآءُونَ","Allatheena hum yuraoona","Those who make show [of their deeds]","Degenen die er een vertoning van maken","کسانی ‌که خودنمایی می‌کنند",6],[107,7,"وَيَمۡنَعُونَ ٱلۡمَاعُونَ","WayamnaAAoona almaAAoona","And withhold [simple] assistance","En die de levensbenodigdheden tegenhouden","و [از امانت دادنِ] وسایل ضروری زندگی دریغ می‌ورزند",7],[106,1,"لِإِيلَٰفِ قُرَيۡشٍ","Lieelafi qurayshin","For the accustomed security of the Quraysh","Vanwege de gewoonte*1 van de Qoeraisj","برای [سپاسگزاری از] همبستگی و اُنس قریش،",1],[106,2,"إِۦلَٰفِهِمۡ رِحۡلَةَ ٱلشِّتَآءِ وَٱلصَّيۡفِ","Eelafihim rihlata alshshitai waalssayfi","Their accustomed security [in] the caravan of winter and summer","Hun gewoonte van het maken van tochten in de winter en de zomer","[همان] همبستگی و اُنسِ آنان در سفر‌های زمستانی [به یَمَن] و تابستانی [به شام]؛",2],[106,3,"فَلۡيَعۡبُدُواْ رَبَّ هَٰذَا ٱلۡبَيۡتِ","FalyaAAbudoo rabba hatha albayti","Let them worship the Lord of this House","Daarom moeten zij de Heer van dit Huis aanbidden","باید پروردگارِ خانۀ کعبه را عبادت کنند؛",3],[106,4,"ٱلَّذِيٓ أَطۡعَمَهُم مِّن جُوعٖ وَءَامَنَهُم مِّنۡ خَوۡفِۭ","Allathee atAAamahum min jooAAin waamanahum min khawfin","Who has fed them, [saving them] from hunger and made them safe, [saving them] from fear","Degene Die hun tegen de honger voedt en hen veilig stelt voor de angst","همان [پروردگاری] که آنان را از گرسنگی [رهانید، به آنان] خوراک داد و از وحشت و ترس ایمن نمود",4],[105,1,"أَلَمۡ تَرَ كَيۡفَ فَعَلَ رَبُّكَ بِأَصۡحَٰبِ ٱلۡفِيلِ","Alam tara kayfa faAAala rabbuka biashabi alfeeli","Have you not considered, [O Muhammad], how your Lord dealt with the companions of the elephant","Heb jij niet vernomen hoe jouw Heer met de mensen van de olifant heeft gehandeld","[ای پیامبر،] آیا ندیدی پروردگارت با اصحاب فیل چه کرد؟",1],[105,2,"أَلَمۡ يَجۡعَلۡ كَيۡدَهُمۡ فِي تَضۡلِيلٖ","Alam yajAAal kaydahum fee tadleelin","Did He not make their plan into misguidance","Heeft Hij hun plan niet verijdeld","آیا [فریب و] نقشۀ آنان را در تباهی قرار نداد؟",2],[105,3,"وَأَرۡسَلَ عَلَيۡهِمۡ طَيۡرًا أَبَابِيلَ","Waarsala AAalayhim tayran ababeela","And He sent against them birds in flocks","En Hij heeft over hen zwermen vogels gezonden","و پرندگانی گروه‌گروه بر [سر] آنان فرستاد",3],[105,4,"تَرۡمِيهِم بِحِجَارَةٖ مِّن سِجِّيلٖ","Tarmeehim bihijaratin min sijjeelin","Striking them with stones of hard clay","Die stenen van klei op hen wierpen","[که] با سنگ‌گِل [که در منقار و چنگال داشتند] آنان را سنگباران می‌کردند؛",4],[105,5,"فَجَعَلَهُمۡ كَعَصۡفٖ مَّأۡكُولِۭ","FajaAAalahum kaAAasfin makoolin","And He made them like eaten straw","Zo maakte Hij hen als (door wormen) aangevreten bladeren","و آنها را همچون کاهِ جویده‌شده ساخت",5],[104,1,"وَيۡلٞ لِّكُلِّ هُمَزَةٖ لُّمَزَةٍ","Waylun likulli humazatin lumazatin","Woe to every scorner and mocker","Wee elke lasteraar en roddelaar","وای بر هر غیبت‌کننده [و] عیبجوی‌",1],[104,2,"ٱلَّذِي جَمَعَ مَالٗا وَعَدَّدَهُۥ","Allathee jamaAAa malan waAAaddadahu","Who collects wealth and [continuously] counts it","Degene die bezit verzamelt en het telkens telt","[همان] کسی که مال فراونی گرد می‌آورد و آن را بارها می‌شمارد",2],[104,3,"يَحۡسَبُ أَنَّ مَالَهُۥٓ أَخۡلَدَهُۥ","Yahsabu anna malahu akhladahu","He thinks that his wealth will make him immortal","Hij denkt dat zijn bezit hem eeuwiglevend maakt","گمان می‌کند که مالَش او را جاودانه می‌سازد",3],[104,4,"كَلَّاۖ لَيُنۢبَذَنَّ فِي ٱلۡحُطَمَةِ","Kalla layunbathanna fee alhutamati","No! He will surely be thrown into the Crusher","Nee! Hij zal zeker in de vernietiger gesmeten worden","هرگز چنین نیست [که او گمان می‌کند]؛ قطعاً در آتشِ درهم‌کوبنده انداخته خواهد شد",4],[104,5,"وَمَآ أَدۡرَىٰكَ مَا ٱلۡحُطَمَةُ","Wama adraka ma alhutamatu","And what can make you know what is the Crusher","En wat doet jou weten wat de vernietiger is","و [ای پیامبر،] تو چه می‌دانی که آتشِ درهم‌کوبنده چیست؟",5],[104,6,"نَارُ ٱللَّهِ ٱلۡمُوقَدَةُ","Naru Allahi almooqadatu","It is the fire of Allah, [eternally] fueled","Het door Allah aangestoken Vuur (de Hel)","آتش برافروختۀ الهی است؛",6],[104,7,"ٱلَّتِي تَطَّلِعُ عَلَى ٱلۡأَفۡـِٔدَةِ","Allatee tattaliAAu AAala alafidati","Which mounts directed at the hearts","Dat tot in de harten doordringt","[آتشی] که بر دل‌ها چیره می‌گردد [و می‌سوزانَد]",7],[104,8,"إِنَّهَا عَلَيۡهِم مُّؤۡصَدَةٞ","lnnaha AAalayhim musadatun","Indeed, Hellfire will be closed down upon them","Voorwaar, het zal hen omhullen","بی‌گمان، آن [آتش] بر آنان بسته شده [و از هر سو محاصره‌شان کرده] است",8],[104,9,"فِي عَمَدٖ مُّمَدَّدَةِۭ","Fee AAamadin mumaddadatin","In extended columns","In langgerekte zuilen","[افروخته] در ستون‌های بلند است",9],[103,1,"وَٱلۡعَصۡرِ","WaalAAasri","By time","Bij de tijd","سوگند به عصر",1],[103,2,"إِنَّ ٱلۡإِنسَٰنَ لَفِي خُسۡرٍ","Inna alinsana lafee khusrin","Indeed, mankind is in loss","Voorwaar, de mens lijdt zeker verlies","که انسان در زیان است",2],[103,3,"إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ وَتَوَاصَوۡاْ بِٱلۡحَقِّ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ","Illa allatheena amanoo waAAamiloo alssalihati watawasaw bialhaqqi watawasaw bialssabri","Except for those who have believed and done righteous deeds and advised each other to truth and advised each other to patience","Behalve degenen die geloven en goede daden verrichten en elkaar aansporen tot de Waarheid en elkaar aansporen tot geduld","مگر مؤمنان نیکوکاری که یکدیگر را به حق سفارش نموده‌اند و به شکیبایی توصیه کرده‌اند",3],[102,1,"أَلۡهَىٰكُمُ ٱلتَّكَاثُرُ","Alhakumu alttakathuru","Competition in [worldly] increase diverts you","Jullie gaan op in de wedijver om meer","زیاده‌خواهی، شما را به خود مشغول [و از یادِ پروردگار غافل] ساخت",1],[102,2,"حَتَّىٰ زُرۡتُمُ ٱلۡمَقَابِرَ","Hatta zurtumu almaqabira","Until you visit the graveyards","Totdat jullie in de graven terechtkomen","تا [پایانِ] كارتان به گورستان رسید",2],[102,3,"كَلَّا سَوۡفَ تَعۡلَمُونَ","Kalla sawfa taAAlamoona","No! You are going to know","Nee, jullie zullen het weten","هرگز چنین نیست [که شما می‌پندارید]؛ به زودی خواهید دانست",3],[102,4,"ثُمَّ كَلَّا سَوۡفَ تَعۡلَمُونَ","Thumma kalla sawfa taAAlamoona","Then no! You are going to know","Nogmaals, nee! Jullie zullen het weten","باز [هم] چنین نیست؛ به زودی خواهید دانست",4],[102,5,"كَلَّا لَوۡ تَعۡلَمُونَ عِلۡمَ ٱلۡيَقِينِ","Kalla law taAAlamoona AAilma alyaqeeni","No! If you only knew with knowledge of certainty","Nee! Als jullie het maar met zekere kennis zouden weten","چنین نیست [که شما گمان می‌کنید]؛ اگر به دانشِ یقینی [و تردیدناپذیر، حقیقتِ قیامت را] می‌دانستید، [از زیاده‌خواهی و افتخار به اموال و فرزندانتان دست برمی‌داشتید]",5],[102,6,"لَتَرَوُنَّ ٱلۡجَحِيمَ","Latarawunna aljaheema","You will surely see the Hellfire","Jullie zullen zeker de Hel zien","سوگند که دوزخ را خواهید دید",6],[102,7,"ثُمَّ لَتَرَوُنَّهَا عَيۡنَ ٱلۡيَقِينِ","Thumma latarawunnaha AAayna alyaqeeni","Then you will surely see it with the eye of certainty","Nogmaals, jullie zullen haar met een zeker oog zien","باز هم سوگند که آن را با چشم یقین خواهید دید؛",7],[102,8,"ثُمَّ لَتُسۡـَٔلُنَّ يَوۡمَئِذٍ عَنِ ٱلنَّعِيمِ","Thumma latusalunna yawmaithin AAani alnnaAAeemi","Then you will surely be asked that Day about pleasure","Dan zullen jullie op die Dag ondervraagd worden over de genietingen","آنگاه قطعاً در آن روز، از [تمام] نعمت‌ها بازخواست خواهید شد",8],[101,1,"ٱلۡقَارِعَةُ","AlqariAAatu","The Striking Calamity","De Daverende (De Dag der Opstanding)","[آن] فروکوبنده",1],[101,2,"مَا ٱلۡقَارِعَةُ","Ma alqariAAatu","What is the Striking Calamity","Wat is de Daverende","[آن] فروکوبنده چیست؟",2],[101,3,"وَمَآ أَدۡرَىٰكَ مَا ٱلۡقَارِعَةُ","Wama adraka ma alqariAAatu","And what can make you know what is the Striking Calamity","En wat doet jou weten wat de Daverende is","و تو چه ‌دانی که [آن] فروکوبنده چیست؟",3],[101,4,"يَوۡمَ يَكُونُ ٱلنَّاسُ كَٱلۡفَرَاشِ ٱلۡمَبۡثُوثِ","Yawma yakoonu alnnasu kaalfarashi almabthoothi","It is the Day when people will be like moths, dispersed","Op de Dag dat de mensen als verstrooide motten zijn","روزی‌ که مردم مانند پروانه‌های پراکنده [حیران و سرگردان] خواهند بود",4],[101,5,"وَتَكُونُ ٱلۡجِبَالُ كَٱلۡعِهۡنِ ٱلۡمَنفُوشِ","Watakoonu aljibalu kaalAAihni almanfooshi","And the mountains will be like wool, fluffed up","En de bergen als vespreide wolvlokken","و کوه‌ها مانند پشم رنگینِ حلاجی‌شده خواهند شد",5],[101,6,"فَأَمَّا مَن ثَقُلَتۡ مَوَٰزِينُهُۥ","Faamma man thaqulat mawazeenuhu","Then as for one whose scales are heavy [with good deeds]","Wat betreft degene van wie dan zijn weegschaal (met goede daden) zwaar weegt","و اما هر کس که [در آن روز،] کفّۀ میزانش سنگین باشد،",6],[101,7,"فَهُوَ فِي عِيشَةٖ رَّاضِيَةٖ","Fahuwa fee AAeeshatin radiyatin","He will be in a pleasant life","Hij zal een behaaglijk leven leiden","[در بهشت،] در زندگی رضایت‌بخشی خواهد بود",7],[101,8,"وَأَمَّا مَنۡ خَفَّتۡ مَوَٰزِينُهُۥ","Waamma man khaffat mawazeenuhu","But as for one whose scales are light","En wat betreft degene van wie zijn weegschaal licht weegt","و اما هر کس که کفّۀ میزانش سبک باشد،",8],[101,9,"فَأُمُّهُۥ هَاوِيَةٞ","Faommuhu hawiyatun","His refuge will be an abyss","Zijn verblijfplaats is dan Hawiyah*2 (de Hel)","[مسکن و] پناهگاهش «هاویه» است",9],[101,10,"وَمَآ أَدۡرَىٰكَ مَا هِيَهۡ","Wama adraka ma hiyah","And what can make you know what that is","En wat doet jou weten wat zij is","و تو چه دانی که آن [هاویه] چیست؟",10],[101,11,"نَارٌ حَامِيَةُۢ","Narun hamiyatun","It is a Fire, intensely hot","Een verbandende Hel","آتشی است سوزان [و شعله‌ور]",11],[100,1,"وَٱلۡعَٰدِيَٰتِ ضَبۡحٗا","WaalAAadiyati dabhan","By the racers, panting","Bij de snuivend voortrennenden","سوگند به اسب‌های دونده که نفس‌زنان [به سوی میدان جهاد] پیش می‌روند",1],[100,2,"فَٱلۡمُورِيَٰتِ قَدۡحٗا","Faalmooriyati qadhan","And the producers of sparks [when] striking","Die vonken slaan","و سوگند به اسب‌هایی که [با برخورد سُم‌هایشان به سنگ‌ها] جرقۀ [آتش] ایجاد می‌کنند",2],[100,3,"فَٱلۡمُغِيرَٰتِ صُبۡحٗا","Faalmugheerati subhan","And the chargers at dawn","Die in de ochtendschemering aanvallen","باز سوگند به اسب‌هایی که در صبحگاهان [بر دشمن] یورش می‌برند",3],[100,4,"فَأَثَرۡنَ بِهِۦ نَقۡعٗا","Faatharna bihi naqAAan","Stirring up thereby [clouds of] dust","Die daarbij stof opwerpen","و در آن هنگام گرد و غبار برمی‌انگیزند",4],[100,5,"فَوَسَطۡنَ بِهِۦ جَمۡعًا","Fawasatna bihi jamAAan","Arriving thereby in the center collectively","Die dan het midden van de gelederen (van de vijand) doorbreken","آنگاه در دل [سپاه دشمن] می‌تازند",5],[100,6,"إِنَّ ٱلۡإِنسَٰنَ لِرَبِّهِۦ لَكَنُودٞ","Inna alinsana lirabbihi lakanoodun","Indeed mankind, to his Lord, is ungrateful","Voorwaar, de mens is zijn Heer zeker ondankbaar","یقیناً انسان در برابر [نعمت‌های] پروردگارش بسیار ناسپاس است،",6],[100,7,"وَإِنَّهُۥ عَلَىٰ ذَٰلِكَ لَشَهِيدٞ","Wainnahu AAala thalika lashaheedun","And indeed, he is to that a witness","En voorwaar, hij is daar zeker getuige van","و بی‌گمان، او [خود] بر این [ناسپاسی] گواه است،",7],[100,8,"وَإِنَّهُۥ لِحُبِّ ٱلۡخَيۡرِ لَشَدِيدٌ","Wainnahu lihubbi alkhayri lashadeedun","And indeed he is, in love of wealth, intense","En voorwaar, hij heeft zeker een hevige liefde voor bezit","و همانا او علاقۀ فراوانی به مال [دنیا] دارد",8],[100,9,"۞أَفَلَا يَعۡلَمُ إِذَا بُعۡثِرَ مَا فِي ٱلۡقُبُورِ","Afala yaAAlamu itha buAAthira ma fee alquboori","But does he not know that when the contents of the graves are scattered","Weet hij dan niet dat, wanneer naar buiten wordt gekeerd wat in de graven is","آیا او نمی‌داند که در آن روز، آنچه در گور‌هاست، [همه زنده و] برانگیخته می‌شوند؟",9],[100,10,"وَحُصِّلَ مَا فِي ٱلصُّدُورِ","Wahussila ma fee alssudoori","And that within the breasts is obtained","En onthuld wordt wat in de harten is","و آنچه در سینه‌هاست [همه] آشکار می‌گردد",10],[100,11,"إِنَّ رَبَّهُم بِهِمۡ يَوۡمَئِذٖ لَّخَبِيرُۢ","Inna rabbahum bihim yawmaithin lakhabeerun","Indeed, their Lord with them, that Day, is [fully] Acquainted","Dat hun Heer op die Dag zeker Alwetend over hen is","یقیناً در آن روز، پروردگارشان کاملاً به [وضع و حال] آنان آگاه است",11],[99,1,"إِذَا زُلۡزِلَتِ ٱلۡأَرۡضُ زِلۡزَالَهَا","Itha zulzilati alardu zilzalaha","When the earth is shaken with its [final] earthquake","Wanneer de aarde door haar beving wordt geschud","هنگامی که زمین با شدید‌ترین تکان‌هایش به لرزه درآید",1],[99,2,"وَأَخۡرَجَتِ ٱلۡأَرۡضُ أَثۡقَالَهَا","Waakhrajati alardu athqalaha","And the earth discharges its burdens","En de aarde haar lasten naar buiten keert","و زمین بار‌های سنگینش را بیرون ریزد",2],[99,3,"وَقَالَ ٱلۡإِنسَٰنُ مَا لَهَا","Waqala alinsanu ma laha","And man says, \"What is [wrong] with it","En de mens zegt: \"Wat is er met haar aan de hand","و انسان می‌گوید: «آن [= زمین] را چه شده است؟»",3],[99,4,"يَوۡمَئِذٖ تُحَدِّثُ أَخۡبَارَهَا","Yawmaithin tuhaddithu akhbaraha","That Day, it will report its news","Op die Dag zal zij haar berichten bekendmaken","در آن روز، [زمین] تمام خبرهایش را بازگو می‌کند؛",4],[99,5,"بِأَنَّ رَبَّكَ أَوۡحَىٰ لَهَا","Bianna rabbaka awha laha","Because your Lord has commanded it","Omdat jouw Heer het haar bevolen heeft","زیرا که پروردگارت به او [چنین] وحی [و حکم] کرده است",5],[99,6,"يَوۡمَئِذٖ يَصۡدُرُ ٱلنَّاسُ أَشۡتَاتٗا لِّيُرَوۡاْ أَعۡمَٰلَهُمۡ","Yawmaithin yasduru alnnasu ashtatan liyuraw aAAmalahum","That Day, the people will depart separated [into categories] to be shown [the result of] their deeds","Op die Dag zullen de mensen in verschillende groepen tevoorschijn komen om hun daden te zien","در آن روز، مردم گروه‌گروه باز می‌گردند تا [نتیجۀ] اعمالشان به آنان نشان داده شود",6],[99,7,"فَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٍ خَيۡرٗا يَرَهُۥ","Faman yaAAmal mithqala tharratin khayran yarahu","So whoever does an atom's weight of good will see it","Wie iets goeds deed ter grootte van een mosterdzaadje, zal het dan zien","آنگاه هر کس به‌ اندازۀ ذره‌ای کار نیک انجام داده باشد، [پاداشِ] آن را می‌بیند؛",7],[99,8,"وَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٖ شَرّٗا يَرَهُۥ","Waman yaAAmal mithqala tharratin sharran yarahu","And whoever does an atom's weight of evil will see it","En wie iets kwaads deed ter grootte van een mosterdzaadje, zal het dan zien","و هر کس به اندازه ذره‌ای کار بد کرده باشد، [کیفرِ] آن را می‌بیند",8],[98,1,"لَمۡ يَكُنِ ٱلَّذِينَ كَفَرُواْ مِنۡ أَهۡلِ ٱلۡكِتَٰبِ وَٱلۡمُشۡرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأۡتِيَهُمُ ٱلۡبَيِّنَةُ","Lam yakuni allatheena kafaroo min ahli alkitabi waalmushrikeena munfakkeena hatta tatiyahumu albayyinatu","Those who disbelieved among the People of the Scripture and the polytheists were not to be parted [from misbelief] until there came to them clear evidence","De ongelovigen onder de Lieden van de Schrift en de veelgodenaanbidders houden niet op (ongelovig te zijn) tot er een duidelijk bewijs tot hen komt","کسانی از اهل کتاب و مشرکان ‌که کافر شدند، [از آیین کفر] دست برنمی‌دارند تا اینکه دلیل روشنی برایشان بیاید",1],[98,2,"رَسُولٞ مِّنَ ٱللَّهِ يَتۡلُواْ صُحُفٗا مُّطَهَّرَةٗ","Rasoolun mina Allahi yatloo suhufan mutahharatan","A Messenger from Allah, reciting purified scriptures","Een Boodschapper van Allah die gereinigde bladen voordraagt","پیامبری از سوی الله [بیاید] که صحیفه‌های پاک را بخواند",2],[98,3,"فِيهَا كُتُبٞ قَيِّمَةٞ","Feeha kutubun qayyimatun","Within which are correct writings","Waarin rechtzinnige boeken (de Koran) zijn","و نوشته‌هایی استوار [و درست] در آن [صحیفه‌ها] است",3],[98,4,"وَمَا تَفَرَّقَ ٱلَّذِينَ أُوتُواْ ٱلۡكِتَٰبَ إِلَّا مِنۢ بَعۡدِ مَا جَآءَتۡهُمُ ٱلۡبَيِّنَةُ","Wama tafarraqa allatheena ootoo alkitaba illa min baAAdi ma jaathumu albayyinatu","Nor did those who were given the Scripture become divided until after there had come to them clear evidence","En degenen aan wie het Boek is gegeven splitsten zich pas op nadat het duidelijke bewijs tot hen gekomen was","و کسانی‌ که به آنان کتاب داده شد [از جمله یهود و نصاری] پراکنده نشدند [و اختلاف نکردند،] مگر بعد از آنکه دلیل روشن برایشان آمد",4],[98,5,"وَمَآ أُمِرُوٓاْ إِلَّا لِيَعۡبُدُواْ ٱللَّهَ مُخۡلِصِينَ لَهُ ٱلدِّينَ حُنَفَآءَ وَيُقِيمُواْ ٱلصَّلَوٰةَ وَيُؤۡتُواْ ٱلزَّكَوٰةَۚ وَذَٰلِكَ دِينُ ٱلۡقَيِّمَةِ","Wama omiroo illa liyaAAbudoo Allaha mukhliseena lahu alddeena hunafaa wayuqeemoo alssalata wayutoo alzzakata wathalika deenu alqayyimati","And they were not commanded except to worship Allah, [being] sincere to Him in religion, inclining to truth, and to establish prayer and to give zakah. And that is the correct religion","Zij werden niets anders bevolen dan Allah met zuivere aanbidding te aanbidden, als Hoenafâ. En (ook) de shalât te verrichten en de zakât te geven en dat is de rechte godsdienst","و آنان فرمان نیافتند جز اینکه الله را عبادت کنند در حالی ‌که دین [خود] را برای او خالص گردانند [و از شرک و عبادت معبودان باطل،] به توحید روی آورند؛ و نماز برپا دارند و زکات بپردازند؛ و این است آیین راستین و مستقیم",5],[98,6,"إِنَّ ٱلَّذِينَ كَفَرُواْ مِنۡ أَهۡلِ ٱلۡكِتَٰبِ وَٱلۡمُشۡرِكِينَ فِي نَارِ جَهَنَّمَ خَٰلِدِينَ فِيهَآۚ أُوْلَـٰٓئِكَ هُمۡ شَرُّ ٱلۡبَرِيَّةِ","Inna allatheena kafaroo min ahli alkitabi waalmushrikeena fee nari jahannama khalideena feeha olaika hum sharru albariyyati","Indeed, they who disbelieved among the People of the Scripture and the polytheists will be in the fire of Hell, abiding eternally therein. Those are the worst of creatures","Voorwaar, degenen die ongelovig zijn onder de Lieden van de Schrift en de veelgodenaanbidders zullen in het vuur van de Hel eeuwig levenden zijn. Zij zijn degenen die de slechtste schepsels zijn","بی‌گمان، کسانی از اهل کتاب و مشرکان ‌که کافر شدند، جاودانه در آتش جهنم خواهند ماند. آنان بدترینِ آفریدگان هستند",6],[98,7,"إِنَّ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ أُوْلَـٰٓئِكَ هُمۡ خَيۡرُ ٱلۡبَرِيَّةِ","Inna allatheena amanoo waAAamiloo alssalihati olaika hum khayru albariyyati","Indeed, they who have believed and done righteous deeds - those are the best of creatures","Voorwaar, degenen die geloven en goede werken verrichten, zij zijn degenen die de beste schepselen zijn","همانا کسانی که ایمان آوردند و کارهای شایسته انجام دادند، آنان بهترینِ آفریدگان هستند",7],[98,8,"جَزَآؤُهُمۡ عِندَ رَبِّهِمۡ جَنَّـٰتُ عَدۡنٖ تَجۡرِي مِن تَحۡتِهَا ٱلۡأَنۡهَٰرُ خَٰلِدِينَ فِيهَآ أَبَدٗاۖ رَّضِيَ ٱللَّهُ عَنۡهُمۡ وَرَضُواْ عَنۡهُۚ ذَٰلِكَ لِمَنۡ خَشِيَ رَبَّهُۥ","Jazaohum AAinda rabbihim jannatu AAadnin tajree min tahtiha alanharu khalideena feeha abadan radiya Allahu AAanhum waradoo AAanhu thalika liman khashiya rabbahu","Their reward with Allah will be gardens of perpetual residence beneath which rivers flow, wherein they will abide forever, Allah being pleased with them and they with Him. That is for whoever has feared his Lord","Hun beloningen bij hun Heer zijn de Tuinen van 'Adn (het Paradijs), waar de rivieren onder door stromen, zij zijn eeuwig levenden daarin, voor altijd. Allah is met hen behaagd en zij zijn met Hem behaagd. Dat is voor wie zijn Heer vreest","پاداش آنان نزد پروردگار‌شان، باغ‌های [بهشت] جاویدان است که جویبارها از زیر [درختان] آن جاری است؛ همیشه در آن خواهند ماند؛ الله از [اعمال] آنها راضی است و آنان [نیز] از [پاداشِ] او راضیند؛ و این [مقام و پاداش،] برای کسی است که از پروردگارش بترسد",8],[97,1,"إِنَّآ أَنزَلۡنَٰهُ فِي لَيۡلَةِ ٱلۡقَدۡرِ","Inna anzalnahu fee laylati alqadri","Indeed, We sent the Qur'an down during the Night of Decree","Voorwaar, Wij hebben hem (de Koran) neergezonden in de Waardevolle Nacht (Lailatoel Qadr)","همانا ما آن [قرآن] را در شب قدر نازل کردیم",1],[97,2,"وَمَآ أَدۡرَىٰكَ مَا لَيۡلَةُ ٱلۡقَدۡرِ","Wama adraka ma laylatu alqadri","And what can make you know what is the Night of Decree","En wat doet jullie weten wat de Waardevolle Nacht is","و تو چه دانی شب قدر چیست؟",2],[97,3,"لَيۡلَةُ ٱلۡقَدۡرِ خَيۡرٞ مِّنۡ أَلۡفِ شَهۡرٖ","Laylatu alqadri khayrun min alfi shahrin","The Night of Decree is better than a thousand months","De Waardevolle Nacht is beter dan duizend maanden","شب قدر، بهتر از هزار ماه است",3],[97,4,"تَنَزَّلُ ٱلۡمَلَـٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذۡنِ رَبِّهِم مِّن كُلِّ أَمۡرٖ","Tanazzalu almalaikatu waalrroohu feeha biithni rabbihim min kulli amrin","The angels and the Spirit descend therein by permission of their Lord for every matter","De Engelen en de Geest (Djibrîl) daalden in haar neer met de toestemming van hun Heer, voor elke beschikking","فرشتگان و روح [= جبرئیل] در آن [شب،] به فرمان پروردگارشان برای [انجام] هر کاری نازل می‌شوند",4],[97,5,"سَلَٰمٌ هِيَ حَتَّىٰ مَطۡلَعِ ٱلۡفَجۡرِ","Salamun hiya hatta matlaAAi alfajri","Peace it is until the emergence of dawn","Vrede heerst (in deze nacht), tot aan de ochtendschemering","[آن شب] تا طلوع فجر، سلامت [و رحمت] است",5],[96,1,"ٱقۡرَأۡ بِٱسۡمِ رَبِّكَ ٱلَّذِي خَلَقَ","Iqra biismi rabbika allathee khalaqa","Recite in the name of your Lord who created","Lees voor! In de naam van jouw Heer, Die heeft geschapen","بخوان به نام پروردگارت که [هستی را] آفرید؛",1],[96,2,"خَلَقَ ٱلۡإِنسَٰنَ مِنۡ عَلَقٍ","Khalaqa alinsana min AAalaqin","Created man from a clinging substance","Hij heeft de mens geschapen van een bloedklomp","[همان پروردگاری که] انسان را از خونِ بسته آفرید",2],[96,3,"ٱقۡرَأۡ وَرَبُّكَ ٱلۡأَكۡرَمُ","Iqra warabbuka alakramu","Recite, and your Lord is the most Generous","Lees voor! En jouw Heer is de Meest Edele","بخوان و پروردگارت [از همه] بزرگوار‌تر است",3],[96,4,"ٱلَّذِي عَلَّمَ بِٱلۡقَلَمِ","Allathee AAallama bialqalami","Who taught by the pen","Degene Die onderwezen heeft met de pen","[همان] ذاتی ‌که به وسیلۀ قلم [نوشتن] آموخت",4],[96,5,"عَلَّمَ ٱلۡإِنسَٰنَ مَا لَمۡ يَعۡلَمۡ","AAallama alinsana ma lam yaAAlam","Taught man that which he knew not","Hij heeft de mens onderwezen wat hij niet wist","به انسان آنچه را که نمی‌دانست [به تدریج] آموخت",5],[96,6,"كَلَّآ إِنَّ ٱلۡإِنسَٰنَ لَيَطۡغَىٰٓ","Kalla inna alinsana layatgha","No! [But] indeed, man transgresses","Nee, voorwaar, de mens is zeker in overtreding","چنین نیست [که شما می‌پندارید]؛ حقا که انسان طغیان [و سرکشی] می‌کند",6],[96,7,"أَن رَّءَاهُ ٱسۡتَغۡنَىٰٓ","An raahu istaghna","Because he sees himself self-sufficient","Omdat hij zichzelf als behoefteloos beschouwt","[بعد] از اینکه خود را بی‌نیاز [و توانگر] ببیند",7],[96,8,"إِنَّ إِلَىٰ رَبِّكَ ٱلرُّجۡعَىٰٓ","Inna ila rabbika alrrujAAa","Indeed, to your Lord is the return","Voorwaar, tot jouw Heer is de terugkeer","یقیناً بازگشت [همه] به سوی پروردگار توست",8],[96,9,"أَرَءَيۡتَ ٱلَّذِي يَنۡهَىٰ","Araayta allathee yanha","Have you seen the one who forbids","Wat denk jij van hem die verbiedt","[ای پیامبر،] آیا دیده‌ای آن کسی [= ابوجهل] را که [از عبادت الله] باز می‌دارد",9],[96,10,"عَبۡدًا إِذَا صَلَّىٰٓ","AAabdan itha salla","A servant when he prays","Een dienaar wanneer hij de shalât verricht","بنده‌ای [= محمد] را هنگامی که [کنار کعبه] نماز می‌خواند",10],[96,11,"أَرَءَيۡتَ إِن كَانَ عَلَى ٱلۡهُدَىٰٓ","Araayta in kana AAala alhuda","Have you seen if he is upon guidance","Wat denk je, als hij (Mohammed) de leiding volgt","به من خبر بده اگر این [بنده بازداشته‌شده] بر [راه] هدایت باشد",11],[96,12,"أَوۡ أَمَرَ بِٱلتَّقۡوَىٰٓ","Aw amara bialttaqwa","Or enjoins righteousness","Of hij tot Taqwa oproept","یا [مردم را] به پرهیزگاری فرمان دهد، [سزای کسی‌ که چنین بنده‌ای را بیازارد چیست؟]",12],[96,13,"أَرَءَيۡتَ إِن كَذَّبَ وَتَوَلَّىٰٓ","Araayta in kaththaba watawalla","Have you seen if he denies and turns away","Wat denk jij, als hij (Abôe Djahl) loochent en zich afwendt","به من خبر بده اگر این [شخص سرکش، حق را] تکذیب کند و رویگردان شود [آیا سزاوار عذاب نیست؟]",13],[96,14,"أَلَمۡ يَعۡلَم بِأَنَّ ٱللَّهَ يَرَىٰ","Alam yaAAlam bianna Allaha yara","Does he not know that Allah sees","Weet hij dan niet dat Allah (hem) ziet","آیا نمی‌داند که بی‌تردید، الله [همه اعمالش را] می‌بیند؟",14],[96,15,"كَلَّا لَئِن لَّمۡ يَنتَهِ لَنَسۡفَعَۢا بِٱلنَّاصِيَةِ","Kalla lain lam yantahi lanasfaAAan bialnnasiyati","No! If he does not desist, We will surely drag him by the forelock","Nee, als hij niet ophoudt, dan zullen Wij hem bij zijn voorhoofdslok grijpen","چنین نیست [که او گمان می‌کند]؛ اگر باز نیاید [و دست از شرارت برندارد،] قطعاً موی پیشانی [او] را به شدّت خواهیم گرفت [و به سوی دوزخ خواهیم کشاند]؛",15],[96,16,"نَاصِيَةٖ كَٰذِبَةٍ خَاطِئَةٖ","Nasiyatin kathibatin khatiatin","A lying, sinning forelock","Een leugenachtige, zondige voorhoofdslok","موی پیشانیِ [همان] دروغگوی خطاکار را",16],[96,17,"فَلۡيَدۡعُ نَادِيَهُۥ","FalyadAAu nadiyahu","Then let him call his associates","Laat hem dan zijn bondgenoten roepen","پس باید هم‌مجلسانش را [به کمک] بخواند",17],[96,18,"سَنَدۡعُ ٱلزَّبَانِيَةَ","SanadAAu alzzabaniyata","We will call the angels of Hell","Wij zullen de Zabâniyah roepen","ما [نیز] آتشبانان [دوزخ] را فرا خواهیم ‌خواند",18],[96,19,"كَلَّا لَا تُطِعۡهُ وَٱسۡجُدۡۤ وَٱقۡتَرِب۩","Kalla la tutiAAhu waosjud waiqtarib","No! Do not obey him. But prostrate and draw near [to Allah]","Nee, gehoorzaam hem niet, en kniel je neer en zoek toenadering (tot Allah)","چنین نیست [که او می‌پندارد]؛ هرگز او را اطاعت مکن و سجده کن، و [به الله] تقرّب جوی",19],[95,1,"وَٱلتِّينِ وَٱلزَّيۡتُونِ","Waaltteeni waalzzaytooni","By the fig and the olive","Bij de vijg en de olijf","سوگند به انجیر و زیتون",1],[95,2,"وَطُورِ سِينِينَ","Watoori seeneena","And [by] Mount Sinai","Bij de berg Sinaï","و سوگند به طورِ سینا",2],[95,3,"وَهَٰذَا ٱلۡبَلَدِ ٱلۡأَمِينِ","Wahatha albaladi alameeni","And [by] this secure city [Makkah]","Bij deze veilige stad (Mekkah)","و سوگند به این شهر امن [مکه]",3],[95,4,"لَقَدۡ خَلَقۡنَا ٱلۡإِنسَٰنَ فِيٓ أَحۡسَنِ تَقۡوِيمٖ","Laqad khalaqna alinsana fee ahsani taqweemin","We have certainly created man in the best of stature","Voorzeker, Wij hebben de mens in de beste vorm geschapen","[که] یقیناً ما انسان را در بهترین صورت [و با فطرت پاک] آفریدیم",4],[95,5,"ثُمَّ رَدَدۡنَٰهُ أَسۡفَلَ سَٰفِلِينَ","Thumma radadnahu asfala safileena","Then We return him to the lowest of the low","Daarna doen Wij hem terugkeren tot het laagste van het laagste","سپس او را [که انحراف یافت،] به پست‌ترین [مراحلِ] پَستی برگرداندیم",5],[95,6,"إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ فَلَهُمۡ أَجۡرٌ غَيۡرُ مَمۡنُونٖ","Illa allatheena amanoo waAAamiloo alssalihati falahum ajrun ghayru mamnoonin","Except for those who believe and do righteous deeds, for they will have a reward uninterrupted","Behalve degenen die geloven en goede daden verrichten. Voor hen is er een ononderbroken beloning","مگر کسانی که ایمان آوردند و کار‌های شایسته انجام دادند؛ که پاداشی پایدار برایشان [در پیش] است",6],[95,7,"فَمَا يُكَذِّبُكَ بَعۡدُ بِٱلدِّينِ","Fama yukaththibuka baAAdu bialddeeni","So what yet causes you to deny the Recompense","Wat doet jullie dan het oordeel nog loochenen","پس [ای انسان،] چه چیزی بعد [از این همه دلایل روشن،] تو را به تکذیب [روز] جزا وا می‌دارد؟",7],[95,8,"أَلَيۡسَ ٱللَّهُ بِأَحۡكَمِ ٱلۡحَٰكِمِينَ","Alaysa Allahu biahkami alhakimeena","Is not Allah the most just of judges","Is Allah niet de Rechtvaardigste der Rechters","آیا الله بهترین داور [و حاکم مطلق] نیست؟",8],[94,1,"أَلَمۡ نَشۡرَحۡ لَكَ صَدۡرَكَ","Alam nashrah laka sadraka","Did We not expand for you, [O Muhammad], your breast","Hebben Wij niet jouw borst verruimd (O Mohammed)","[ای پیامبر،] آیا ما سینه‌ات را [برای نزول وحی] برایت نگشودیم؟",1],[94,2,"وَوَضَعۡنَا عَنكَ وِزۡرَكَ","WawadaAAna AAanka wizraka","And We removed from you your burden","En Wij hebben jouw last van je weggenomen","و سنگینی [بارِ گناه و دشواریِ رسالت] را از [دوشِ] تو برنداشتیم؟",2],[94,3,"ٱلَّذِيٓ أَنقَضَ ظَهۡرَكَ","Allathee anqada thahraka","Which had weighed upon your back","Die jouw rug belastte","همان [باری] که بر پشتت سنگینی می‌کرد",3],[94,4,"وَرَفَعۡنَا لَكَ ذِكۡرَكَ","WarafaAAna laka thikraka","And raised high for you your repute","En Wij hebben jouw roem verhoogd","و [نام و] آوازۀ تو را بلند ساختیم",4],[94,5,"فَإِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرًا","Fainna maAAa alAAusri yusran","For indeed, with hardship [will be] ease","Voorwaar, zo komt met de moeilijkeid de verlichting","مسلماً با [هر] دشواری، آسانی است",5],[94,6,"إِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرٗا","Inna maAAa alAAusri yusran","Indeed, with hardship [will be] ease","Voorwaar, met de moeilijkheid komt de verlichting","[آری؛] مسلماً با [هر] دشواری، آسانی است",6],[94,7,"فَإِذَا فَرَغۡتَ فَٱنصَبۡ","Faitha faraghta fainsab","So when you have finished [your duties], then stand up [for worship]","Wanneer jij dan een taak volbracht hebt, streef dan (verder)","پس هنگامی‌ که [از کار و امور دنیا] فارغ شدی، [به عبادت پروردگارت] بکوش",7],[94,8,"وَإِلَىٰ رَبِّكَ فَٱرۡغَب","Waila rabbika fairghab","And to your Lord direct [your] longing","En richt jouw verlangen tot jouw Heer","و به سوی پروردگارت راغب [و مشتاق] شو",8],[93,1,"وَٱلضُّحَىٰ","Waaldduha","By the morning brightness","Bij het ochtendlicht","سوگند به آغاز روز،",1],[93,2,"وَٱلَّيۡلِ إِذَا سَجَىٰ","Waallayli itha saja","And [by] the night when it covers with darkness","En bij de nacht wanneer het geheel donker is","و سوگند به شب، هنگامی‌ که آرام گیرد",2],[93,3,"مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ","Ma waddaAAaka rabbuka wama qala","Your Lord has not taken leave of you, [O Muhammad], nor has He detested [you]","Jouw Heer heeft jou (O Moehammad) niet verlaten en Hij is niet kwaad (op jou)","[که] پروردگارت تو را وانگذاشته و [بر تو] خشم نگرفته است",3],[93,4,"وَلَلۡأٓخِرَةُ خَيۡرٞ لَّكَ مِنَ ٱلۡأُولَىٰ","Walalakhiratu khayrun laka mina aloola","And the Hereafter is better for you than the first [life]","En het latere (het Hiernamaals) is zeker beter voor jou dan het eerste (het wereldse leven)","و مسلماً آخرت برای تو از دنیا بهتر است",4],[93,5,"وَلَسَوۡفَ يُعۡطِيكَ رَبُّكَ فَتَرۡضَىٰٓ","Walasawfa yuAAteeka rabbuka fatarda","And your Lord is going to give you, and you will be satisfied","En jouw Heer zal jou zeker gunsten schenken, zodat jij tevreden zult zijn","و به زودی پروردگارت به تو [و امت تو آنقدر] عطا خواهد کرد که راضی گردی",5],[93,6,"أَلَمۡ يَجِدۡكَ يَتِيمٗا فَـَٔاوَىٰ","Alam yajidka yateeman faawa","Did He not find you an orphan and give [you] refuge","Heeft Hij jou niet als wees gevonden en jou in bescherming genomen","آیا تو را یتیم نیافت، و پناه داد؟",6],[93,7,"وَوَجَدَكَ ضَآلّٗا فَهَدَىٰ","Wawajadaka dallan fahada","And He found you lost and guided [you]","En Hij heeft jou dwalend gevonden en jou geleid","و تو را [راه‌نایافته و] سرگشته یافت، و هدایت کرد",7],[93,8,"وَوَجَدَكَ عَآئِلٗا فَأَغۡنَىٰ","Wawajadaka AAailan faaghna","And He found you poor and made [you] self-sufficient","En Hij heeft jou behoeftig gevonden en rijk gemaakt","و تو را فقیر یافت، و بی‌نیاز نمود",8],[93,9,"فَأَمَّا ٱلۡيَتِيمَ فَلَا تَقۡهَرۡ","Faamma alyateema fala taqhar","So as for the orphan, do not oppress [him]","Wat de wees betreft: beledig hem niet","پس [تو نیز] یتیم را میازار،",9],[93,10,"وَأَمَّا ٱلسَّآئِلَ فَلَا تَنۡهَرۡ","Waamma alssaila fala tanhar","And as for the petitioner, do not repel [him]","En wat de bedelaar betreft: wijs hem niet af","و [مستمندِ] نیازخواه را مران [و با او خشونت مکن]،",10],[93,11,"وَأَمَّا بِنِعۡمَةِ رَبِّكَ فَحَدِّثۡ","Waamma biniAAmati rabbika fahaddith","But as for the favor of your Lord, report [it]","En wat de gunsten van jouw Heer betreft: spreek daarover","و نعمت‌های پروردگارت را بازگو کن [و سپاس گزار]",11],[1001,1,"ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلۡحَيُّ ٱلۡقَيُّومُۚ لَا تَأۡخُذُهُۥ سِنَةٞ وَلَا نَوۡمٞۚ لَّهُۥ مَا فِي ٱلسَّمَٰوَٰتِ وَمَا فِي ٱلۡأَرۡضِۗ مَن ذَا ٱلَّذِي يَشۡفَعُ عِندَهُۥٓ إِلَّا بِإِذۡنِهِۦۚ يَعۡلَمُ مَا بَيۡنَ أَيۡدِيهِمۡ وَمَا خَلۡفَهُمۡۖ وَلَا يُحِيطُونَ بِشَيۡءٖ مِّنۡ عِلۡمِهِۦٓ إِلَّا بِمَا شَآءَۚ وَسِعَ كُرۡسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَۖ وَلَا يَـُٔودُهُۥ حِفۡظُهُمَاۚ وَهُوَ ٱلۡعَلِيُّ ٱلۡعَظِيمُ","Allahu la ilaha illa huwa alhayyu alqayyoomu la takhuthuhu sinatun wala nawmun lahu ma fee alssamawati wama fee alardi man tha allathee yashfaAAu AAindahu illa biithnihi yaAAlamu ma bayna aydeehim wama khalfahum wala yuheetoona bishayin min AAilmihi illa bima shaa wasiAAa kursiyyuhu alssamawati waalarda wala yaooduhu hifthuhuma wahuwa alAAaliyyu alAAatheemu","Allah - there is no deity except Him, the Ever-Living, the Sustainer of [all] existence. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and whatever is on the earth. Who is it that can intercede with Him except by His permission? He knows what is [presently] before them and what will be after them, and they encompass not a thing of His knowledge except for what He wills. His Kursi extends over the heavens and the earth, and their preservation tires Him not. And He is the Most High, the Most Great","Allah, er is geen god dan Hij, de Levende, de Zelfstandige, sluimer noch slaap kan Hem treffen, aan Hem behoort toe wat er in de hemelen en wat er op de aarde is. Wie is degene die van voorspraak is bij Hem zonder Zijn verlof? Hij kent wat er voor hen is en wat er achter hen is. En zij kunnen niets van Zijn Kennis omvatten, behalve wat Hij wil. En Zijn Zetel strekt zich uit over de Hemelen en de Aarde en het waken over beide vermoeit Hem niet. En Hij is de Verhevene, de Almachtige","الله [معبودِ راستین است؛] هیچ معبودی [به‌حق] جز او نیست؛ زندۀ پاینده [و قائم به ذات] است؛ نه خوابی سبک او را فرا می‌گیرد و نه خوابی سنگین؛ [و لحظه‌ای از تدبیر جهان هستی، غافل نمی‌ماند]؛ آنچه در آسمان‌ها و زمین است، از آنِ اوست. کیست که نزد او جز به فرمانش شفاعت کند؟ گذشته و آیندۀ آنان [= بندگان] را می‌داند و [آنان] به چیزی از علم او احاطه [و آگاهی] نمی‌یابند، مگر آنچه خود [الله] بخواهد. کرسیِ او آسمان‌ها و زمین را در بر گرفته است و نگهداشتنِ آنها بر او [سنگین و] دشوار نیست و او بلندمرتبه [و] بزرگ است",255],[1002,1,"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبَارَكَ اسْمُكَ، وَتَعَالَىٰ جَدُّكَ، وَلَا إِلَٰهَ غَيْرُكَ","Subhanaka Allahumma wa bihamdika, wa tabarakasmuka, wa ta'ala jadduka, wa la ilaha ghayruk","Glory be to You, O Allah, and praise be to You. Blessed is Your name, exalted is Your majesty, and there is no god besides You.","Glorie zij U, o Allah, en alle lof zij U. Gezegend is Uw naam, verheven is Uw majesteit, en er is geen god naast U.","پاک و منزّهی تو ای الله، و ستایش از آنِ توست. نامت پربرکت است، شکوهت والاست، و هیچ معبودی جز تو نیست.",0],[1003,1,"التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ","At-tahiyyatu lillahi was-salawatu wat-tayyibat. As-salamu 'alayka ayyuhan-nabiyyu wa rahmatullahi wa barakatuh","All greetings, prayers and good things are for Allah. Peace be upon you, O Prophet, and the mercy of Allah and His blessings.","Alle groeten, gebeden en goede dingen zijn voor Allah. Vrede zij met u, o Profeet, en de barmhartigheid van Allah en Zijn zegeningen.","همه‌ی درودها و نمازها و پاکی‌ها از آنِ الله است. سلام بر تو ای پیامبر، و رحمت الله و برکاتش بر تو باد.",0],[1003,2,"السَّلَامُ عَلَيْنَا وَعَلَىٰ عِبَادِ اللَّهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا اللَّهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ","As-salamu 'alayna wa 'ala 'ibadillahis-salihin. Ashhadu an la ilaha illallah, wa ashhadu anna Muhammadan 'abduhu wa rasuluh","Peace be upon us and upon the righteous servants of Allah. I bear witness that there is no god but Allah, and I bear witness that Muhammad is His servant and His messenger.","Vrede zij met ons en met de rechtschapen dienaren van Allah. Ik getuig dat er geen god is dan Allah, en ik getuig dat Mohammed Zijn dienaar en Zijn boodschapper is.","سلام بر ما و بر بندگان شایسته‌ی الله. گواهی می‌دهم که هیچ معبودی به‌حق جز الله نیست، و گواهی می‌دهم که محمد بنده و فرستاده‌ی اوست.",0],[1004,1,"اللَّهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ","Allahumma salli 'ala Muhammadin wa 'ala ali Muhammad, kama sallayta 'ala Ibrahima wa 'ala ali Ibrahim, innaka Hamidun Majid","O Allah, send Your blessings upon Muhammad and upon the family of Muhammad, as You sent blessings upon Ibrahim and upon the family of Ibrahim. Truly, You are Praiseworthy, Glorious.","O Allah, schenk Uw genade aan Mohammed en aan de familie van Mohammed, zoals U die schonk aan Ibrahim en aan de familie van Ibrahim. Waarlijk, U bent de Geprezene, de Glorierijke.","بارالها، بر محمد و خاندان محمد درود فرست، همان‌گونه که بر ابراهیم و خاندان ابراهیم درود فرستادی. همانا تو ستوده و باشکوهی.",0],[1004,2,"اللَّهُمَّ بَارِكْ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ","Allahumma barik 'ala Muhammadin wa 'ala ali Muhammad, kama barakta 'ala Ibrahima wa 'ala ali Ibrahim, innaka Hamidun Majid","O Allah, bless Muhammad and the family of Muhammad, as You blessed Ibrahim and the family of Ibrahim. Truly, You are Praiseworthy, Glorious.","O Allah, zegen Mohammed en de familie van Mohammed, zoals U Ibrahim en de familie van Ibrahim hebt gezegend. Waarlijk, U bent de Geprezene, de Glorierijke.","بارالها، بر محمد و خاندان محمد برکت فرست، همان‌گونه که بر ابراهیم و خاندان ابراهیم برکت فرستادی. همانا تو ستوده و باشکوهی.",0],[1005,1,"رَبَّنَآ ءَاتِنَا فِي ٱلدُّنۡيَا حَسَنَةٗ وَفِي ٱلۡأٓخِرَةِ حَسَنَةٗ وَقِنَا عَذَابَ ٱلنَّارِ","Rabbana atina fid-dunya hasanatan wa fil-akhirati hasanatan wa qina 'adhaban-nar","Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.","Onze Heer, geef ons het goede in deze wereld en het goede in het Hiernamaals, en bescherm ons tegen de bestraffing van het Vuur.","پروردگارا، در دنیا به ما نیکی عطا کن و در آخرت نیز نیکی، و ما را از عذاب آتش نگه دار.",201]],"ST":{"1":{"en":"Al-Fatihah, \"The Opening\", is the first surah of the Quran and is recited in every rak'ah of every prayer. The Prophet ﷺ called it the \"Mother of the Book\" and the \"seven oft-repeated verses\" (see 15:87). In a hadith qudsi reported by Muslim, Allah says He has divided the prayer between Himself and His servant: the first half of Al-Fatihah is praise of Allah, and the second half is the servant asking for guidance, \"and My servant shall have what he asked for.\" Most scholars hold that it was revealed in Mecca.","fa":"سوره‌ی فاتحه («گشاینده») نخستین سوره‌ی قرآن است و در هر رکعتِ هر نماز خوانده می‌شود. پیامبر ﷺ آن را «امّ‌الکتاب» (مادر کتاب) و «سبع‌المثانی» (هفت آیه‌ی تکرارشونده؛ حِجر ۸۷) نامیده است. در حدیث قدسی‌ای که مسلم روایت کرده، الله می‌فرماید نماز را میان خود و بنده‌اش تقسیم کرده است: نیمه‌ی نخست فاتحه ستایش الله است و نیمه‌ی دوم درخواست هدایت از سوی بنده، «و برای بنده‌ام همان است که خواست». بیشتر علما آن را مکی می‌دانند."},"114":{"en":"An-Nas and Al-Falaq are known together as al-Mu'awwidhatayn, \"the two surahs of seeking refuge\". The Prophet ﷺ said that nothing like these verses had ever been revealed (Muslim). Each night before sleeping he recited them together with Al-Ikhlas, blew into his cupped hands and wiped them over his body (Bukhari). In An-Nas we seek refuge in the Lord, King and God of mankind from the whisperer who withdraws: the devil who whispers into hearts, whether from jinn or from people. Many commentators link these two surahs to a time in Medina when the Prophet was affected by sorcery, so some count them as Medinan; others hold they are Meccan.","fa":"سوره‌های ناس و فلق را با هم «مُعوِّذَتَین» (دو سوره‌ی پناه‌جویی) می‌نامند. پیامبر ﷺ فرمود که هرگز آیاتی مانند این‌ها نازل نشده است (مسلم). او هر شب پیش از خواب، این دو سوره را همراه با سوره‌ی اخلاص می‌خواند، در کف دستانش می‌دمید و دستانش را بر بدنش می‌کشید (بخاری). در سوره‌ی ناس به پروردگار، پادشاه و معبود مردم پناه می‌بریم از شرّ وسوسه‌گرِ پنهان‌شونده؛ شیطانی که در دل‌ها وسوسه می‌کند، چه از جن باشد و چه از انسان. بسیاری از مفسران نزول این دو سوره را به زمانی در مدینه پیوند می‌دهند که پیامبر دچار سحر شد؛ از این رو برخی آن‌ها را مدنی و برخی مکی می‌دانند."},"113":{"en":"Al-Falaq and An-Nas are al-Mu'awwidhatayn, \"the two surahs of seeking refuge\", and the Prophet ﷺ recited them for protection, especially before sleep and after prayers. In Al-Falaq we seek refuge in the Lord of daybreak from the evil of what He created, from the darkness of night when it settles, from those who blow on knots (practitioners of sorcery), and from the envier when he envies. Uqbah ibn Amir reported that the Prophet ﷺ told him no one has sought refuge with anything better than these two surahs (Abu Dawud, Nasa'i).","fa":"سوره‌های فلق و ناس «مُعوِّذَتَین» (دو سوره‌ی پناه‌جویی) هستند و پیامبر ﷺ آن‌ها را برای حفاظت می‌خواند، به‌ویژه پیش از خواب و پس از نمازها. در سوره‌ی فلق به پروردگارِ سپیده‌دم پناه می‌بریم از شرّ آنچه آفریده، از شرّ تاریکی شب آنگاه که فرا رسد، از شرّ دمندگان در گره‌ها (جادوگران)، و از شرّ حسود آنگاه که حسد ورزد. عُقبة بن عامر روایت کرده که پیامبر ﷺ به او فرمود هیچ‌کس با چیزی بهتر از این دو سوره پناه نجسته است (ابوداود، نسائی)."},"112":{"en":"According to reports in Tirmidhi and other collections, the idolaters of Quraysh (in some reports, a group of Jews) asked the Prophet ﷺ to describe the lineage of his Lord. This surah was revealed in reply: Allah is One, the Eternal Refuge whom all need, He neither begets nor is born, and nothing is comparable to Him. The Prophet ﷺ said it is equal to a third of the Quran (Bukhari). A companion who recited it in every prayer said he loved it because it describes the Most Merciful, and the Prophet told him that his love for it would bring him into Paradise (Bukhari).","fa":"بر پایه‌ی روایاتی در ترمذی و دیگر کتاب‌ها، مشرکان قریش (و در برخی روایات گروهی از یهودیان) از پیامبر ﷺ خواستند نَسَب پروردگارش را برایشان وصف کند. این سوره در پاسخ نازل شد: الله یگانه است، بی‌نیازی که همه به او نیازمندند، نه زاده و نه زاده شده، و هیچ‌کس همتای او نیست. پیامبر ﷺ فرمود این سوره برابر با یک‌سوم قرآن است (بخاری). یکی از یاران که آن را در هر نماز می‌خواند گفت آن را دوست دارد چون صفت الله مهربان است، و پیامبر به او فرمود محبتش به این سوره او را به بهشت می‌برد (بخاری)."},"111":{"en":"When the Prophet ﷺ was commanded to warn his closest relatives, he climbed the hill of Safa and called out to the clans of Quraysh. After he warned them, his uncle Abu Lahab said, \"May you perish! Is this what you gathered us for?\" This surah was revealed in response (Bukhari, Muslim). It also mentions his wife, Umm Jamil, who is reported to have scattered thorns in the Prophet's path. Abu Lahab died a disbeliever, as the surah foretold.","fa":"هنگامی که به پیامبر ﷺ فرمان داده شد خویشاوندان نزدیکش را هشدار دهد، بر کوه صفا رفت و قبیله‌های قریش را فراخواند. پس از آنکه آنان را هشدار داد، عمویش ابولهب گفت: «نابود شوی! آیا برای این ما را جمع کردی؟» و این سوره در پاسخ او نازل شد (بخاری، مسلم). در این سوره از همسرش اُمّ جمیل نیز یاد شده است که روایت شده خار در مسیر پیامبر می‌ریخت. ابولهب همان‌گونه که این سوره خبر داده بود، در حال کفر درگذشت."},"110":{"en":"One of the last surahs to be revealed, reportedly near the end of the Prophet's life. It speaks of Allah's help, the victory (the conquest of Mecca) and people entering Islam in crowds, and tells the Prophet ﷺ to glorify his Lord and seek His forgiveness. When Umar asked the senior companions about it, Ibn Abbas explained that it was a sign that the Prophet's time was drawing near, and Umar agreed (Bukhari). Aisha reported that after it was revealed, the Prophet often said in his bowing and prostration: \"Subhanaka Allahumma Rabbana wa bihamdik, Allahumma ighfir li\" (Bukhari).","fa":"از آخرین سوره‌هایی است که نازل شد و روایت شده که در اواخر زندگی پیامبر ﷺ فرود آمد. از یاری الله، پیروزی (فتح مکه) و گروه‌گروه درآمدنِ مردم به اسلام سخن می‌گوید و به پیامبر فرمان می‌دهد پروردگارش را تسبیح گوید و از او آمرزش بخواهد. وقتی عمر از بزرگان صحابه درباره‌ی آن پرسید، ابن عباس توضیح داد که این سوره نشانه‌ی نزدیک شدن پایان عمر پیامبر است و عمر سخن او را تأیید کرد (بخاری). عایشه روایت کرده که پس از نزول آن، پیامبر در رکوع و سجده بسیار می‌گفت: «سبحانک اللهم ربنا و بحمدک، اللهم اغفر لی» (بخاری)."},"109":{"en":"Leaders of Quraysh, among them al-Walid ibn al-Mughirah and al-As ibn Wa'il, offered the Prophet ﷺ a compromise: he would worship their idols for a year, and they would worship Allah for a year. This surah was revealed as a clear refusal, ending with \"For you is your religion, and for me is mine.\" The Prophet ﷺ often recited it together with Al-Ikhlas in the two sunnah rak'ahs before Fajr (Muslim).","fa":"سران قریش، از جمله ولید بن مغیره و عاص بن وائل، به پیامبر ﷺ پیشنهاد سازش دادند: او یک سال بت‌هایشان را بپرستد و آنان یک سال الله را. این سوره به عنوان پاسخی روشن و قاطع نازل شد و با این آیه پایان می‌یابد: «دین شما برای خودتان و دین من برای خودم.» پیامبر ﷺ اغلب این سوره را همراه با سوره‌ی اخلاص در دو رکعت سنّت پیش از نماز صبح می‌خواند (مسلم)."},"108":{"en":"The shortest surah in the Quran. Reports say that after the Prophet's sons died in infancy, al-As ibn Wa'il mocked him as \"abtar\", cut off, with no son to carry on his name. Allah answered that He had given the Prophet ﷺ al-Kawthar, abundant good, and that it is his enemy who is truly cut off. Anas reported that the Prophet ﷺ described al-Kawthar as a river in Paradise that his Lord had promised him (Muslim).","fa":"کوتاه‌ترین سوره‌ی قرآن است. روایت شده که پس از درگذشت پسران پیامبر ﷺ در کودکی، عاص بن وائل او را «اَبتَر» (بی‌دنباله و بی‌نسل) خواند. الله پاسخ داد که به پیامبر «کوثر»، یعنی خیرِ فراوان، عطا کرده و این دشمن اوست که به‌راستی بی‌دنباله است. اَنَس روایت کرده که پیامبر ﷺ کوثر را رودی در بهشت توصیف کرد که پروردگارش به او وعده داده است (مسلم)."},"107":{"en":"The opening verses condemn the one who denies the Day of Judgement, harshly drives away the orphan and does not encourage feeding the poor; commentators mention leaders of Quraysh such as Abu Jahl as examples. The later verses warn those who are heedless of their prayers, who pray only to be seen, and who hold back even small kindnesses such as lending everyday items. Many scholars link these later verses to the hypocrites of Medina, and scholars differ on whether the surah is Meccan, Medinan, or partly both.","fa":"آیات آغازین، کسی را نکوهش می‌کند که روز جزا را دروغ می‌انگارد، یتیم را با خشونت می‌راند و دیگران را به سیر کردن مستمندان تشویق نمی‌کند؛ مفسران از سران قریش مانند ابوجهل به عنوان نمونه یاد کرده‌اند. آیات پایانی، کسانی را هشدار می‌دهد که از نمازشان غافل‌اند، برای دیده شدن نماز می‌خوانند و حتی از کمک‌های کوچک مانند امانت دادن وسایل روزمره دریغ می‌کنند. بسیاری از علما این آیات را به منافقان مدینه مربوط می‌دانند و درباره‌ی مکی یا مدنی بودن این سوره اختلاف نظر وجود دارد."},"106":{"en":"Quraysh lived by trade, sending caravans to Yemen in winter and to Syria in summer, and they lived in safety around the Kaaba while the tribes around them raided one another. This surah reminds them of these favours and calls them to worship the Lord of this House, who fed them against hunger and made them safe from fear. Many scholars read it as closely connected to Al-Fil, which comes just before it: Allah protected the Kaaba so that Quraysh could enjoy this security.","fa":"قریش از راه تجارت زندگی می‌کردند و کاروان‌هایشان را زمستان به یمن و تابستان به شام می‌فرستادند، و در حالی که قبایل اطرافشان به یکدیگر یورش می‌بردند، آنان در کنار کعبه در امنیت بودند. این سوره این نعمت‌ها را به یادشان می‌آورد و آنان را به پرستش پروردگارِ این خانه فرا می‌خواند؛ همو که در گرسنگی خوراکشان داد و از ترس ایمنشان ساخت. بسیاری از علما این سوره را از نظر معنا پیوسته با سوره‌ی فیل می‌دانند که پیش از آن آمده است: الله کعبه را حفظ کرد تا قریش از این امنیت بهره‌مند شوند."},"105":{"en":"Shortly before the Prophet's birth, Abraha, the Abyssinian ruler of Yemen, marched on Mecca with an army and an elephant to destroy the Kaaba. Allah sent flocks of birds that pelted them with stones of baked clay, and the army was destroyed. The event was so well known that the Arabs named that year the \"Year of the Elephant\", and the Prophet ﷺ was born in it. Some of the Meccans who first heard this surah had seen the event themselves.","fa":"اندکی پیش از تولد پیامبر ﷺ، اَبرَهه، فرمانروای حبشیِ یمن، با سپاهی و فیلی به سوی مکه لشکر کشید تا کعبه را ویران کند. الله دسته‌دسته پرندگانی فرستاد که آنان را با سنگ‌هایی از گِلِ سخت‌شده سنگباران کردند و سپاه نابود شد. این رویداد چنان شناخته‌شده بود که عرب‌ها آن سال را «عام‌الفیل» (سال فیل) نامیدند و پیامبر ﷺ در همان سال به دنیا آمد. برخی از مردم مکه که نخستین بار این سوره را شنیدند، خود شاهد آن رویداد بودند."},"104":{"en":"A warning to the slanderer and backbiter who gathers wealth and counts it, thinking his wealth will make him live forever. Commentators name men of Quraysh who mocked the Prophet ﷺ and the believers, such as al-Akhnas ibn Shariq or Umayyah ibn Khalaf, but most say the warning applies to anyone with these traits. It describes al-Hutamah, the crushing Fire, kindled by Allah, that rises over the hearts.","fa":"هشداری است به عیب‌جو و غیبت‌کننده‌ای که مال گرد می‌آورد و آن را می‌شمارد و گمان می‌کند ثروتش او را جاودانه می‌سازد. مفسران از مردانی از قریش نام برده‌اند که پیامبر ﷺ و مؤمنان را مسخره می‌کردند، مانند اَخنَس بن شَریق یا اُمیّة بن خلف، اما بیشتر آنان می‌گویند این هشدار شامل هر کسی است که چنین ویژگی‌هایی داشته باشد. این سوره «حُطَمه» را وصف می‌کند؛ آتشِ درهم‌کوبنده‌ی برافروخته‌ی الله که بر دل‌ها چیره می‌شود."},"103":{"en":"Allah swears by time that every human being is in loss, except those who believe, do good deeds, and urge one another to the truth and to patience. Imam al-Shafi'i is reported to have said that if people reflected on this surah alone, it would be enough for them. It is also reported (al-Tabarani) that when two companions met, they would not part until one of them had recited Al-'Asr to the other.","fa":"الله به زمان سوگند می‌خورد که همه‌ی انسان‌ها در زیان‌اند، مگر کسانی که ایمان آورده‌اند، کارهای شایسته کرده‌اند و یکدیگر را به حق و به شکیبایی سفارش کرده‌اند. از امام شافعی نقل شده که اگر مردم تنها در این سوره بیندیشند، برایشان کافی است. همچنین روایت شده (طبرانی) که هرگاه دو تن از صحابه با هم دیدار می‌کردند، از یکدیگر جدا نمی‌شدند تا یکی از آن دو سوره‌ی عصر را برای دیگری بخواند."},"102":{"en":"Competing for more distracts people until they reach the graves. Some commentators report that it was revealed about two clans of Quraysh who boasted about their numbers, even counting their dead in the graveyards to outdo each other. The Prophet ﷺ recited it and said: \"The son of Adam says, 'My wealth, my wealth!' But do you own anything of your wealth except what you ate and used up, what you wore and wore out, or what you gave in charity and sent ahead?\" (Muslim).","fa":"رقابت در افزون‌خواهی، مردم را سرگرم می‌کند تا آنکه به گورها می‌رسند. برخی مفسران روایت کرده‌اند که این سوره درباره‌ی دو تیره از قریش نازل شد که به شمار افرادشان فخر می‌فروختند و حتی مردگانشان را در گورستان می‌شمردند تا بر یکدیگر برتری جویند. پیامبر ﷺ این سوره را خواند و فرمود: «فرزند آدم می‌گوید: مالم، مالم! آیا از مالت جز آنچه خوردی و از میان بردی، پوشیدی و کهنه کردی، یا صدقه دادی و پیش فرستادی، چیزی از آنِ توست؟» (مسلم)."},"101":{"en":"Al-Qari'ah, \"the Striking Calamity\", is one of the names of the Day of Judgement. The surah describes people scattered like moths and the mountains like fluffed-up wool, followed by the weighing of deeds: those whose scales are heavy will have a pleasing life, and those whose scales are light will have Hawiyah, a blazing Fire. It is an early Meccan surah that shook its listeners with the reality of the Hereafter.","fa":"«قارعه» (کوبنده) یکی از نام‌های روز قیامت است. این سوره مردم را مانند پروانه‌های پراکنده و کوه‌ها را مانند پشمِ زده‌شده وصف می‌کند و سپس از سنجش اعمال سخن می‌گوید: کسانی که ترازوی اعمالشان سنگین است، زندگی‌ای خشنود دارند، و کسانی که ترازویشان سبک است، جایگاهشان «هاویه»، آتشی سوزان، است. این سوره از سوره‌های آغازین مکی است که شنوندگانش را با حقیقت آخرت تکان می‌داد."},"100":{"en":"Allah swears by the charging war horses that pant, strike sparks with their hooves and raid at dawn, then declares that man is ungrateful to his Lord and intensely attached to wealth, and reminds him that what is in the graves will be brought out and what is in the hearts made known. Ibn Abbas and most commentators explain the opening oaths as referring to horses; Ali ibn Abi Talib is reported to have explained them as the camels of the pilgrims. Most scholars count it as Meccan.","fa":"الله به اسبان جنگیِ تازنده سوگند می‌خورد که نفس‌زنان می‌دوند، با سُم‌هایشان جرقه می‌افروزند و سپیده‌دم یورش می‌برند؛ سپس اعلام می‌کند که انسان نسبت به پروردگارش ناسپاس است و دلبستگی شدیدی به مال دارد، و به او یادآوری می‌کند که آنچه در گورهاست بیرون آورده و آنچه در دل‌هاست آشکار خواهد شد. ابن عباس و بیشتر مفسران سوگندهای آغازین را درباره‌ی اسبان می‌دانند و از علی بن ابی‌طالب نقل شده که آن را شتران حاجیان دانسته است. بیشتر علما این سوره را مکی می‌دانند."},"99":{"en":"It describes the final earthquake, when the earth throws out its burdens and, by Allah's command, reports everything that was done upon it. Then people will be shown their deeds: whoever has done an atom's weight of good will see it, and whoever has done an atom's weight of evil will see it. The Prophet ﷺ called these last two verses \"the unique, all-encompassing verse\" (Bukhari). Scholars differ on whether the surah is Meccan or Medinan.","fa":"این سوره زلزله‌ی پایانی را وصف می‌کند؛ هنگامی که زمین بارهای سنگینش را بیرون می‌افکند و به فرمان الله از هر آنچه بر رویش انجام شده خبر می‌دهد. سپس اعمال مردم به آنان نشان داده می‌شود: هر کس هم‌وزن ذرّه‌ای نیکی کرده باشد آن را می‌بیند، و هر کس هم‌وزن ذرّه‌ای بدی کرده باشد آن را می‌بیند. پیامبر ﷺ این دو آیه‌ی پایانی را «آیه‌ی یگانه و جامع» نامید (بخاری). درباره‌ی مکی یا مدنی بودن این سوره میان علما اختلاف نظر است."},"98":{"en":"It speaks of the People of the Book and the idolaters, who would not leave their ways until the clear proof came to them: a messenger from Allah reciting purified pages. In Medina, the Prophet ﷺ told Ubayy ibn Ka'b that Allah had commanded him to recite this surah to him. Ubayy asked, \"Did He mention me by name?\" When the Prophet said yes, Ubayy wept (Bukhari, Muslim). Most scholars count it as Medinan.","fa":"این سوره از اهل کتاب و مشرکان سخن می‌گوید که از راه خود دست برنمی‌داشتند تا آنکه دلیل روشن برایشان آمد: فرستاده‌ای از سوی الله که صحیفه‌هایی پاک را تلاوت می‌کند. در مدینه، پیامبر ﷺ به اُبَیّ بن کعب فرمود که الله به او فرمان داده این سوره را برای او بخواند. اُبَیّ پرسید: «آیا الله نام مرا برد؟» و چون پیامبر فرمود آری، اُبَیّ گریست (بخاری، مسلم). بیشتر علما این سوره را مدنی می‌دانند."},"97":{"en":"It announces that the Quran was first sent down on Laylat al-Qadr, the Night of Decree, which is better than a thousand months. In it the angels and Jibril descend by their Lord's permission, and it is peace until the break of dawn. The Prophet ﷺ told the believers to seek it in the odd nights of the last ten nights of Ramadan (Bukhari), and said that whoever stands in prayer on that night with faith and hoping for reward will have their past sins forgiven (Bukhari, Muslim).","fa":"این سوره اعلام می‌کند که نزول قرآن در «لیلة‌القدر» (شب قدر) آغاز شد؛ شبی که از هزار ماه بهتر است. در آن شب فرشتگان و جبرئیل به اذن پروردگارشان فرود می‌آیند و آن شب تا طلوع سپیده سراسر سلامت است. پیامبر ﷺ به مؤمنان فرمود آن را در شب‌های فرد از دهه‌ی آخر رمضان بجویند (بخاری)، و فرمود هر کس آن شب را با ایمان و به امید پاداش به نماز بایستد، گناهان گذشته‌اش آمرزیده می‌شود (بخاری، مسلم)."},"96":{"en":"Its first five verses were the very first revelation. The Prophet ﷺ was in the cave of Hira when the angel Jibril came and said, \"Read!\" He replied that he could not read; Jibril pressed him tightly three times and then recited these verses (Bukhari). The later verses came afterwards and concern Abu Jahl, who tried to stop the Prophet from praying at the Kaaba and threatened to step on his neck. The surah ends with a verse of prostration.","fa":"پنج آیه‌ی نخست این سوره، نخستین وحی بود. پیامبر ﷺ در غار حِرا بود که فرشته جبرئیل آمد و گفت: «بخوان!» او پاسخ داد که خواندن نمی‌داند؛ جبرئیل سه بار او را به سختی در آغوش فشرد و سپس این آیات را خواند (بخاری). آیات بعدی پس از آن نازل شد و درباره‌ی ابوجهل است که می‌کوشید پیامبر را از نماز خواندن در کنار کعبه باز دارد و تهدید کرد که پا بر گردن او خواهد گذاشت. این سوره با آیه‌ی سجده پایان می‌یابد."},"95":{"en":"Allah swears by the fig and the olive, Mount Sinai and \"this secure city\" (Mecca). Many commentators explain these as the lands of the prophets: the land of the fig and olive (Jerusalem and Syria, linked to Isa), Sinai (Musa) and Mecca (Muhammad ﷺ). Allah created man in the best of forms, yet he can fall to the lowest of the low, except those who believe and do good. Al-Bara' ibn 'Azib said he heard the Prophet ﷺ recite it in the 'Isha prayer while travelling, and he had never heard a more beautiful voice (Bukhari).","fa":"الله به انجیر و زیتون، کوه سینا و «این شهر امن» (مکه) سوگند می‌خورد. بسیاری از مفسران این‌ها را سرزمین‌های پیامبران دانسته‌اند: سرزمین انجیر و زیتون (بیت‌المقدس و شام، مرتبط با عیسی)، سینا (موسی) و مکه (محمد ﷺ). الله انسان را در بهترین ساختار آفرید، اما او می‌تواند به پست‌ترین مرتبه فرو افتد، مگر کسانی که ایمان آورده و کار شایسته کرده‌اند. بَراء بن عازب گفت شنید که پیامبر ﷺ در سفر این سوره را در نماز عشا خواند و هرگز صدایی زیباتر از صدای او نشنیده بود (بخاری)."},"94":{"en":"Revealed in Mecca during the hardships of the early years, it reminds the Prophet ﷺ that Allah expanded his chest, removed the burden that weighed on his back and raised his mention, and it promises twice that \"with hardship comes ease\". It is often read as a companion to Ad-Duha, which comes just before it, since both console the Prophet in difficult times. It ends by telling him to turn to his Lord in worship once his work is done.","fa":"این سوره در مکه و در سختی‌های سال‌های نخست نازل شد و به پیامبر ﷺ یادآوری می‌کند که الله سینه‌اش را گشاده ساخت، باری را که پشتش را سنگین کرده بود برداشت و نامش را بلندآوازه کرد، و دو بار وعده می‌دهد که «با سختی، آسانی است». این سوره را اغلب همراه سوره‌ی ضحی می‌دانند که پیش از آن آمده است، زیرا هر دو در روزهای دشوار پیامبر را دلداری می‌دهند. در پایان به او می‌فرماید چون از کارش فارغ شد، به عبادت پروردگارش روی آورد."},"93":{"en":"When revelation paused for a while, a woman of Quraysh taunted the Prophet ﷺ, saying that his \"devil\" had abandoned him (Bukhari, Muslim; some reports name her as Umm Jamil, the wife of Abu Lahab). Allah revealed this surah, swearing by the morning brightness and by the night that He had neither abandoned the Prophet nor become displeased with him. It reminds him how Allah sheltered him as an orphan, guided him and made him free of need, and tells him not to oppress the orphan, not to turn away the one who asks, and to speak of his Lord's blessings.","fa":"هنگامی که وحی مدتی قطع شد، زنی از قریش پیامبر ﷺ را طعنه زد و گفت «شیطانش» او را رها کرده است (بخاری، مسلم؛ در برخی روایات نام او اُمّ جمیل، همسر ابولهب، آمده است). الله این سوره را نازل کرد و به روشنایی روز و به شب سوگند خورد که نه پیامبر را رها کرده و نه از او ناخشنود شده است. به او یادآوری می‌کند که الله او را در یتیمی پناه داد، هدایتش کرد و بی‌نیازش ساخت، و به او می‌فرماید بر یتیم سخت نگیرد، درخواست‌کننده را نراند و از نعمت‌های پروردگارش سخن بگوید."},"1001":{"en":"Verse 255 of Surah Al-Baqarah, known as Ayat al-Kursi, the Verse of the Throne. The Prophet ﷺ asked Ubayy ibn Ka'b which verse in the Book of Allah is the greatest. When Ubayy answered, \"Allah, there is no god but Him, the Ever-Living, the Sustainer of all\", the Prophet struck him on the chest and said, \"May knowledge delight you, Abu al-Mundhir!\" (Muslim). In a narration in Bukhari, Abu Hurayrah was taught that whoever recites it on going to bed will have a guardian from Allah through the night, and no devil will come near him until morning. Many Muslims also recite it after each obligatory prayer.","fa":"آیه‌ی ۲۵۵ سوره‌ی بقره که «آیة‌الکرسی» نام دارد. پیامبر ﷺ از اُبَیّ بن کعب پرسید کدام آیه در کتاب الله بزرگ‌ترین است. چون اُبَیّ پاسخ داد: «الله، هیچ معبودی جز او نیست، زنده و پاینده»، پیامبر بر سینه‌اش زد و فرمود: «دانش بر تو گوارا باد، ای ابوالمنذر!» (مسلم). در روایتی در بخاری، به ابوهریره آموخته شد که هر کس هنگام رفتن به بستر آن را بخواند، تا صبح نگهبانی از سوی الله با اوست و هیچ شیطانی به او نزدیک نمی‌شود. بسیاری از مسلمانان آن را پس از هر نماز فرض نیز می‌خوانند."},"1002":{"en":"In the Hanafi school, after the opening takbir (\"Allahu Akbar\") and before Al-Fatihah, the person praying recites this praise quietly in the first rak'ah. It is reported from the Prophet ﷺ through Aisha and Abu Sa'id al-Khudri (Abu Dawud, Tirmidhi), and Umar ibn al-Khattab is reported to have said it aloud so that people would learn it (Muslim). The Hanafi school follows this wording as the opening supplication.","fa":"در مذهب حنفی، نمازگزار پس از تکبیر آغاز نماز («الله اکبر») و پیش از سوره‌ی فاتحه، این ثنا را در رکعت نخست آهسته می‌خواند. این ذکر از طریق عایشه و ابوسعید خُدری از پیامبر ﷺ روایت شده است (ابوداود، ترمذی)، و نقل شده که عمر بن خطاب آن را بلند می‌گفت تا مردم بیاموزند (مسلم). مذهب حنفی همین الفاظ را به عنوان دعای آغاز نماز برگزیده است."},"1003":{"en":"Recited while sitting after every second rak'ah and in the final sitting of the prayer. The Hanafi school uses the wording taught by Abdullah ibn Mas'ud, who said the Prophet ﷺ taught it to him with his hand held between the Prophet's hands, just as he would teach a surah of the Quran (Bukhari, Muslim). In this app it is split into two parts to make it easier to memorize.","fa":"این ذکر در نشستنِ پس از هر دو رکعت و در نشستن پایانی نماز خوانده می‌شود. مذهب حنفی از الفاظی پیروی می‌کند که عبدالله بن مسعود روایت کرده است؛ او گفت پیامبر ﷺ در حالی که دستش میان دستان پیامبر بود، آن را به او آموخت، همان‌گونه که سوره‌ای از قرآن را می‌آموخت (بخاری، مسلم). در این برنامه برای آسان‌تر شدن حفظ، به دو بخش تقسیم شده است."},"1004":{"en":"In the final sitting, after the Tashahhud, the Hanafi school recites this prayer of blessings on the Prophet ﷺ. When the companions asked how they should send blessings on him, the Prophet taught them these words, which ask Allah to bless him and his family as He blessed Ibrahim and his family (Bukhari, Muslim, from Ka'b ibn 'Ujrah). The first part is known as \"Allahumma salli\" and the second as \"Allahumma barik\".","fa":"در نشستن پایانی، پس از تشهد، در مذهب حنفی این درود بر پیامبر ﷺ خوانده می‌شود. هنگامی که یاران از پیامبر پرسیدند چگونه بر او درود بفرستند، این الفاظ را به آنان آموخت که از الله می‌خواهد بر او و خاندانش درود و برکت فرستد، همان‌گونه که بر ابراهیم و خاندانش فرستاد (بخاری، مسلم، از کعب بن عُجره). بخش نخست به «اللهم صلّ» و بخش دوم به «اللهم بارک» شناخته می‌شود."},"1005":{"en":"From Surah Al-Baqarah 2:201. Anas ibn Malik reported that this was the supplication the Prophet ﷺ made most often (Bukhari, Muslim). In the Hanafi school, after the Salawat in the final sitting, the person praying makes a supplication in words similar to those of the Quran or the Prophet's own supplications, then ends the prayer with the salam. This verse is one of the most common choices.","fa":"از سوره‌ی بقره، آیه‌ی ۲۰۱. انس بن مالک روایت کرده که این دعایی بود که پیامبر ﷺ بیش از همه می‌خواند (بخاری، مسلم). در مذهب حنفی، نمازگزار در نشستن پایانی پس از درود ابراهیمی، دعایی با الفاظی همانند قرآن یا دعاهای پیامبر می‌خواند و سپس با سلام نماز را به پایان می‌برد. این آیه از رایج‌ترین انتخاب‌هاست."}},"RV":{"1":{"t":"Meccan","o":5,"pe":"revealed in the early years in Mecca, about 610–615 CE","pf":"نازل‌شده در سال‌های آغازین در مکه، حدود ۶۱۰ تا ۶۱۵ میلادی","ne":"Some scholars hold that it was revealed twice, once in Mecca and again in Medina.","nf":"برخی از علما بر این باورند که دو بار نازل شد، یک بار در مکه و بار دیگر در مدینه."},"93":{"t":"Meccan","o":11,"pe":"revealed in the early years in Mecca, about 610–615 CE","pf":"نازل‌شده در سال‌های آغازین در مکه، حدود ۶۱۰ تا ۶۱۵ میلادی","ne":"Revealed after a pause in revelation during the first years of the mission.","nf":"پس از وقفه‌ای در وحی، در سال‌های نخست رسالت نازل شد."},"94":{"t":"Meccan","o":12,"pe":"revealed in the early years in Mecca, about 610–615 CE","pf":"نازل‌شده در سال‌های آغازین در مکه، حدود ۶۱۰ تا ۶۱۵ میلادی"},"95":{"t":"Meccan","o":28,"pe":"revealed in the early years in Mecca, about 610–615 CE","pf":"نازل‌شده در سال‌های آغازین در مکه، حدود ۶۱۰ تا ۶۱۵ میلادی"},"96":{"t":"Meccan","o":1,"pe":"revealed in the early years in Mecca, about 610–615 CE","pf":"نازل‌شده در سال‌های آغازین در مکه، حدود ۶۱۰ تا ۶۱۵ میلادی","ne":"Verses 1–5 were the very first revelation, in the cave of Hira in 610 CE; the rest of the surah came somewhat later.","nf":"آیات ۱ تا ۵ نخستین وحی بود، در غار حِرا در سال ۶۱۰ میلادی؛ بقیه‌ی سوره کمی بعد نازل شد."},"97":{"t":"Meccan","o":25,"pe":"revealed in the early years in Mecca, about 610–615 CE","pf":"نازل‌شده در سال‌های آغازین در مکه، حدود ۶۱۰ تا ۶۱۵ میلادی"},"98":{"t":"Medinan","o":100,"pe":"revealed after the Hijra to Medina, 622–632 CE","pf":"نازل‌شده پس از هجرت به مدینه، ۶۲۲ تا ۶۳۲ میلادی"},"99":{"t":"Medinan","o":93,"pe":"revealed after the Hijra to Medina, 622–632 CE","pf":"نازل‌شده پس از هجرت به مدینه، ۶۲۲ تا ۶۳۲ میلادی","ne":"Some scholars consider it Meccan.","nf":"برخی از علما آن را مکی می‌دانند."},"100":{"t":"Meccan","o":14,"pe":"revealed in the early years in Mecca, about 610–615 CE","pf":"نازل‌شده در سال‌های آغازین در مکه، حدود ۶۱۰ تا ۶۱۵ میلادی"},"101":{"t":"Meccan","o":30,"pe":"revealed in the early years in Mecca, about 610–615 CE","pf":"نازل‌شده در سال‌های آغازین در مکه، حدود ۶۱۰ تا ۶۱۵ میلادی"},"102":{"t":"Meccan"
